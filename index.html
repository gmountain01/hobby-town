/* Layout: full-screen 3D town; HUD chips pinned top, one bottom sheet for every conversation, textbook-style yellow marker on grammar points */
:root{
  --ink:#17233b; --muted:#5a6680; --paper:#ffffff; --tint:#eef4fb; --line:#d5deea;
  --accent:#1c5bd0; --accent-ink:#ffffff; --mark:#ffe169; --ok:#1d8f50; --bad:#cf3f36;
  --display:"Flags","Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Flags","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#bfe3ee;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;will-change:transform}
.place{font-family:var(--display);font-size:16px;color:var(--ink);text-align:center;line-height:1.05;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff}
.place small{display:block;font-family:var(--body);font-size:10px;color:var(--muted)}
.place.done::after{content:"✓";display:inline-block;margin-left:3px;color:var(--ok)}
.name{font-size:12px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.name.me{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.name.npc{background:#efeaff;border:1.5px solid #8f7ae6;color:#2c2160;display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 3px}
.name.npc .ai{display:inline-flex;align-items:center;gap:2px;background:#6c55d9;color:#fff;border-radius:999px;padding:0 6px 0 2px;font-size:10px;font-weight:800;letter-spacing:.04em;line-height:16px}
.name.npc .ai svg{width:14px;height:14px}
.tag.typing{display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #c9d3e3;border-radius:14px;padding:6px 9px;box-shadow:0 2px 6px rgba(23,35,59,.15)}
.tag.typing i,#typBar i{display:block;width:6px;height:6px;border-radius:50%;background:#8a93a6;animation:tdot 1s infinite}
.tag.typing i:nth-child(2),#typBar i:nth-child(2){animation-delay:.15s}.tag.typing i:nth-child(3),#typBar i:nth-child(3){animation-delay:.3s}
.tag.typing.tome{border-color:var(--accent,#1c5bd0)}.tag.typing.tome i{background:var(--accent,#1c5bd0)}
@keyframes tdot{0%,60%,100%{transform:translateY(0) scale(.85);opacity:.4}30%{transform:translateY(-6px) scale(1.15);opacity:1}}
@keyframes pen{0%,100%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(3px,-2px) rotate(6deg)}50%{transform:translate(6px,0) rotate(-6deg)}75%{transform:translate(3px,1px) rotate(8deg)}}
@keyframes tpulse{0%,100%{box-shadow:0 4px 12px rgba(0,0,0,.2),0 0 0 0 rgba(79,143,247,.55)}50%{box-shadow:0 4px 12px rgba(0,0,0,.2),0 0 0 7px rgba(79,143,247,0)}}
.pen{display:inline-block;width:20px;height:20px;animation:pen .9s ease-in-out infinite;transform-origin:20% 80%}.pen svg{width:20px;height:20px}
#typBar{animation:tpulse 1.4s ease-out infinite}
.tag.typing{animation:tbob 1.2s ease-in-out infinite}@keyframes tbob{0%,100%{margin-top:0}50%{margin-top:-3px}}
#typBar{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:8;background:#17233b;color:#fff;border-radius:999px;padding:7px 14px;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap;max-width:calc(100vw - 32px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
#typBar[hidden]{display:none!important}#typBar i{background:#fff}#typBar .dots{display:flex;gap:3px}
.hint .dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}.hint .dots i{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent,#1c5bd0);animation:tdot 1s infinite}.hint .dots i:nth-child(2){animation-delay:.15s}.hint .dots i:nth-child(3){animation-delay:.3s}
.name.peer{background:#fff;border:2px solid #1f2a44;font-weight:700;color:#17233b}
.bubble{background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:14px;
  max-width:190px;white-space:normal;text-align:center;box-shadow:0 2px 0 var(--ink)}
.obj{font-size:12px;font-weight:700;background:#fff;border:1.5px dashed var(--accent);color:var(--accent);border-radius:8px;padding:1px 6px}
.g{background:linear-gradient(transparent 45%,var(--mark) 45%);font-weight:700}

.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);

button{font:inherit;color:inherit;cursor:pointer}

.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--paper);border-radius:18px 18px 0 0;
  box-shadow:0 -6px 24px rgba(23,35,59,.18);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-height:72%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}

.dot{width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid var(--ink)}
.x{border:0;background:var(--tint);border-radius:10px;width:34px;height:34px;font-size:18px}
.log{display:flex;flex-direction:column;gap:6px}
.ln{max-width:85%;padding:7px 11px;border-radius:14px;font-size:15px;line-height:1.45;background:var(--tint)}

.says{display:flex;flex-direction:column;gap:8px}

.hint{font-size:13px;color:var(--muted);line-height:1.5}
.fb{font-size:14px;border-radius:10px;padding:8px 10px;line-height:1.5}
.fb.ok{background:#e4f5ea;color:var(--ok)}
.fb.bad{background:#fbe8e6;color:var(--bad)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.pick{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:14px}
.pick[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.big{font-size:19px;line-height:1.5}
.free{display:flex;gap:6px;align-items:center}
.free input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:12px;color:var(--ink);background:var(--paper)}

.ai{font-size:11px;font-weight:700;background:var(--ink);color:#fff;border-radius:6px;padding:3px 6px;flex:none}
.ln small{display:block;opacity:.72;font-size:12px;margin-top:2px}
.ln.fix{align-self:flex-end;background:#fff4cc;color:var(--ink);font-size:14px;max-width:92%}
.mini{border:0;background:none;font-size:15px;padding:0 0 0 4px;vertical-align:middle;line-height:0}
.label{font-size:12px;letter-spacing:.04em;color:var(--muted)}

#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 66px);width:min(92%,460px);
  background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:0 3px 0 var(--ink);display:flex;gap:10px;align-items:center}

/* 위쪽 알림이 떠 있어도 그 아래 땅을 누를 수 있게 (듣기 버튼만 눌려요) */

.spk{border:0;background:var(--mark);border-radius:10px;width:44px;height:44px;flex:none;line-height:0}

.ms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

.ms span{font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}

.card{background:var(--paper);border-radius:20px;max-width:420px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(23,35,59,.25);max-height:100%;overflow-y:auto}

.field{display:flex;flex-direction:column;gap:5px}

.hcard{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--accent);border-radius:14px;padding:12px}

.namerow .pick{white-space:nowrap}
#nick.need{border-color:var(--bad);animation:shake .12s linear 4}
.needmsg{background:#fff1f0;border:2px solid var(--bad);color:#8a1f18;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:17px;font-weight:700}

.needbox{outline:3px solid var(--bad);outline-offset:4px;border-radius:12px;animation:shake .12s linear 4}
.qmark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e3e9f3;color:#5a6680;font-size:22px}

.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

.hb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-size:14px}

.cty[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
select{font:inherit;font-size:15px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);max-width:60%}
.sheet.tall{height:min(88%,780px);max-height:none;overflow:hidden}

.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.qbtn{flex:none;border:1.5px solid var(--ink);background:var(--paper);border-radius:12px;padding:6px 11px;font-size:14px;white-space:nowrap;text-align:left;line-height:1.3}
.qbtn small{display:block;font-size:11px;color:var(--muted)}
.modes{display:flex;gap:4px;background:var(--tint);border-radius:12px;padding:3px}

.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:24vh;overflow-y:auto;padding:2px}

.kb{display:flex;flex-direction:column;gap:5px;user-select:none;-webkit-user-select:none}

.kb button[aria-pressed="true"]{background:var(--ink);color:#fff}
.kocard{border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff8d6;display:flex;gap:8px;align-items:center}
.kocard div{flex:1;min-width:0}
.kocard b{display:block;font-size:18px}
.kocard small{color:var(--muted);font-size:13px}
.sendrow{display:flex;gap:6px}
/* 접기: 대화창을 작게 줄여서 캐릭터들이 보이게 (마지막 말만 보여요) */
.sheet .fold{font-size:22px;line-height:1;transition:transform .2s}.sheet.folded .fold{transform:rotate(180deg)}
.sheet.folded > *:not(.sh-head):not(.chat){display:none!important}
.sheet.folded .chat{max-height:none}.sheet.folded .chat > *:not(:last-child){display:none}
@media (max-width:520px){
  .sheet{max-height:62%;padding-top:10px;gap:8px}
  .chat{max-height:19vh;gap:6px}
  .msg .b{font-size:17px;padding:7px 11px}.msg .av{flex-basis:26px;height:26px;font-size:13px}
  .chips{max-height:17vh;gap:5px}.chips .chip-c{font-size:17px;padding:8px 11px}
  .kb button{height:38px;font-size:17px}.pv{min-height:42px}
}
.sendrow .btn{flex:1}
.sendrow .btn[disabled]{opacity:.45}
.note{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px}
.note div{flex:1;min-width:0}.note b{display:block;font-size:15px}.note small{color:var(--muted);font-size:12px}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:34vh;overflow-y:auto;padding:4px 2px;overscroll-behavior:contain}
.msg{display:flex;align-items:flex-end;gap:6px;max-width:90%}
.msg.them{align-self:flex-start}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .av{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;border:2px solid #fff;box-shadow:0 1px 4px rgba(23,35,59,.2)}
.msg .b{padding:9px 13px;border-radius:18px;font-size:19px;line-height:1.4;word-break:keep-all;min-width:0}
.msg.them .b{background:#fff;border:1.5px solid var(--line);border-bottom-left-radius:5px}

.msg .mini{flex:0 0 auto;align-self:center}

.chat .sys{align-self:center;background:#e4f5ea;color:var(--ok);border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px;text-align:center}
.chat .new.them,.chat .new.typing{animation:msgL .32s cubic-bezier(.2,.9,.3,1.2) both}.chat .new.me{animation:msgR .32s cubic-bezier(.2,.9,.3,1.2) both}.chat .sys.new{animation:msgL .35s both}
@keyframes msgL{from{opacity:0;transform:translate(-14px,8px) scale(.9)}to{opacity:1;transform:none}}

.fix{display:flex;gap:8px;align-items:center;background:#e4f5ea;color:var(--ok);border-radius:12px;padding:8px 12px;font-size:18px;font-weight:700}

.chips .chip-c{font-size:19px;padding:10px 14px}
.kbt{flex:0 0 56px!important;font-size:20px;padding:10px 0}
.endbox{display:flex;flex-direction:column;gap:8px}
.ico{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.3em;flex:none}

.place .ico{width:30px;height:30px;display:block;margin:0 auto 1px}

.actic{pointer-events:none;background:#fff;border:2px solid var(--ink);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--ink)}

#gamePanel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(calc(100% - 96px),420px);z-index:4;background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:0 3px 0 var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:8px}

const SIGN_DRAW=[];
function roomOf(id){return ROOMS.find(r=>r.id===id);}
function fadeMat(r,o){const m=new THREE.MeshLambertMaterial(Object.assign({transparent:true},o));r.mats.push(m);return m;}
function signboard(id,text,bg,fg,glow){const r=roomOf(id);const sw=Math.min(r.w-1.2,4.6),y=2.5+(r.h-2.5)/2,z=r.z+r.d/2+.2;
  const c=document.createElement('canvas');c.width=512;c.height=112;const t=new THREE.CanvasTexture(c);t.anisotropy=MAXANI;
  const draw=()=>{const g=c.getContext('2d');g.clearRect(0,0,512,112);g.fillStyle=bg;g.beginPath();g.roundRect?g.roundRect(4,4,504,104,18):g.rect(4,4,504,104);g.fill();
    g.lineWidth=6;g.strokeStyle='rgba(255,255,255,.55)';g.stroke();g.fillStyle=fg;g.font='68px "Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif';g.textAlign='center';g.textBaseline='middle';
    if(glow){g.shadowColor=fg;g.shadowBlur=14;}g.fillText(text,256,60);t.needsUpdate=true;};
  draw();SIGN_DRAW.push(draw);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(sw,sw*112/512),fadeMat(r,{map:t,emissive:glow?'#333333':'#000000'}));m.position.set(r.x,y,z);scene.add(m);return {r,y,z,sw};}
function awning(id,c1,c2){const r=roomOf(id);const tex=canvasTex(64,16,(g,w,h)=>{for(let i=0;i<8;i++){g.fillStyle=i%2?c2:c1;g.fillRect(i*8,0,8,h);}},1,1);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(2.9,1),fadeMat(r,{map:tex,side:THREE.DoubleSide}));m.position.set(r.x,2.45,r.z+r.d/2+.55);m.rotation.x=-Math.PI/2+.55;scene.add(m);
  // 차양 끝 물결 장식
  for(let i=0;i<6;i++){const sc=new THREE.Mesh(new THREE.CircleGeometry(.24,10,0,Math.PI),fadeMat(r,{color:i%2?c2:c1,side:THREE.DoubleSide}));sc.rotation.z=Math.PI;sc.position.set(r.x-1.21+i*.484,2.03,r.z+r.d/2+.98);scene.add(sc);}}

function hanokRoof(id,col,ridge){const r=roomOf(id);const rm=r.mats[1];rm.color.set(col);
  const hw=r.d/2+.9,H=r.d*.42,sh=new THREE.Shape();sh.moveTo(-hw,.55);sh.quadraticCurveTo(-hw*.5,H*.32,0,H);sh.quadraticCurveTo(hw*.5,H*.32,hw,.55);sh.lineTo(hw*.82,0);sh.lineTo(-hw*.82,0);sh.closePath();
  const L=r.w+1.6,geo=new THREE.ExtrudeGeometry(sh,{depth:L,bevelEnabled:false});geo.translate(0,0,-L/2);geo.rotateY(Math.PI/2);
  const m=new THREE.Mesh(geo,rm);m.position.set(r.x,r.h+.4,r.z);scene.add(m);
  const rmat=fadeMat(r,{color:ridge});const rg=new THREE.Mesh(box(L+.3,.32,.45),rmat);rg.position.set(r.x,r.h+.4+H+.1,r.z);scene.add(rg);
  for(const sx of [-1,1]){const e=new THREE.Mesh(box(.3,.55,.5),fadeMat(r,{color:'#f4efe1'}));e.position.set(r.x+sx*(L/2+.2),r.h+.4+H+.2,r.z);scene.add(e);}
  // 기와 줄무늬
  const lm=fadeMat(r,{color:ridge});for(let i=1;i<=3;i++){const t=i/4,zz=hw*(1-t)*.98,yy=.55+(H-.55)*Math.pow(t,1.35);for(const sz of [-1,1]){const ln=new THREE.Mesh(box(L,.08,.12),lm);ln.position.set(r.x,r.h+.4+yy+.04,r.z+sz*zz);scene.add(ln);}}}

const SKY=[[0,'#1d2a5c',.42,.08],[4.5,'#24346a',.44,.1],[6,'#f2b8a0',.6,.35],[7.5,'#bfe3ee',.85,.6],[17,'#bfe3ee',.9,.65],[18.5,'#f4a988',.7,.4],[19.7,'#4a4f8f',.5,.15],[21,'#1d2a5c',.42,.08],[24,'#1d2a5c',.42,.08]];
const skyA=new THREE.Color(),skyB=new THREE.Color();
function applyDayNight(hour){let i=0;while(i<SKY.length-2&&hour>=SKY[i+1][0])i++;const a=SKY[i],b=SKY[i+1],t=Math.min(1,Math.max(0,(hour-a[0])/(b[0]-a[0])));
  skyA.set(a[1]).lerp(skyB.set(b[1]),t);scene.background.copy(skyA);scene.fog.color.copy(skyA);
  hemi.intensity=a[2]+(b[2]-a[2])*t;sun.intensity=a[3]+(b[3]-a[3])*t;
  const night=Math.max(0,Math.min(1,1-(sun.intensity-.08)/.45)); // 0 = 낮, 1 = 밤
  hemi.color.setRGB(1-.25*night,1-.2*night,1);sun.color.set(night>.6?'#a9bcff':'#fff3d8');
  const ang=(hour-6)/12*Math.PI;sun.position.set(Math.cos(ang)*40,Math.max(8,Math.sin(ang)*40),12);
  for(const g of NIGHT_GLOW)g.m.emissive.copy(g.day).lerp(g.night,night);}

// Supabase 채널 하나 = 마을 하나. 각자 상태(이름·위치·말풍선…)를 broadcast로 보내고, presence로 누가 있는지 알아요.
function supaChannel(client,topic,myId,lobby){
  const ch=client.channel(topic,{config:{presence:{key:myId},broadcast:{self:false}}});
  const state={},others=new Map(),members=new Set(),hs=[];let lastSend=0,pend=null;
  const list=()=>{const out=[{peer:myId,sameTab:true,isMe:true,kind:'viewer',presence:state}];
    if(lobby){const ps=ch.presenceState();for(const id in ps)if(id!==myId)out.push({peer:id,sameTab:false,isMe:false,kind:'viewer',presence:(ps[id]&&ps[id][0])||{}});return out;}
    for(const id of members)if(id!==myId)out.push({peer:id,sameTab:false,isMe:false,kind:'viewer',presence:others.get(id)||{}});return out;};
  const fire=()=>{const p=list();hs.forEach(h=>{try{h({peers:p})}catch(e){}});};
  const send=()=>{lastSend=Date.now();pend=null;ch.send({type:'broadcast',event:'st',payload:{id:myId,s:state}}).catch(()=>{});};
  // 1초에 최대 2번만 보내요 (무료 한도 아끼기)
  const sendSoon=()=>{const wait=500-(Date.now()-lastSend);if(wait<=0)send();else if(!pend)pend=setTimeout(send,wait);};
  ch.on('broadcast',{event:'st'},({payload})=>{if(!payload||typeof payload.id!=='string'||payload.id===myId)return;others.set(payload.id,payload.s||{});members.add(payload.id);fire();});
  // presence 목록이 잠깐 늦게 와도 받은 상태(이름 등)는 지우지 않아요. 나간 사람만 leave 때 지워요
  let askT=0;
  ch.on('presence',{event:'sync'},()=>{const ids=new Set(Object.keys(ch.presenceState()));for(const id of [...members])if(!ids.has(id))members.delete(id);for(const id of ids)if(id!==myId)members.add(id);
    if(!lobby&&[...members].some(id=>!others.has(id))&&Date.now()-askT>3000){askT=Date.now();ch.send({type:'broadcast',event:'need',payload:{id:myId}}).catch(()=>{});}
    fire();});
  if(!lobby){ch.on('presence',{event:'leave'},({key})=>{if(key&&key!==myId){const ps=ch.presenceState();if(!ps[key]){members.delete(key);others.delete(key);fire();}}});
    ch.on('broadcast',{event:'need'},()=>{setTimeout(send,150+Math.random()*700);});}
  if(!lobby)ch.on('presence',{event:'join'},({key})=>{if(key!==myId)setTimeout(send,200+Math.random()*600);});
  const ready=new Promise((res,rej)=>{ch.subscribe(st=>{if(st==='SUBSCRIBED'){ch.track({at:Date.now()}).catch(()=>{});res();}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')rej(new Error(st));});});
  return{ready,
    // 로비(전체 50명)는 presence에 마을 번호만 올려요. 마을(10명 이하) 안에서만 상태를 주고받아요
    presence:async patch=>{const same=Object.keys(patch).every(k=>JSON.stringify(state[k])===JSON.stringify(patch[k]));Object.assign(state,patch);await ready;if(same&&!lobby)return; // 바뀐 게 없으면(멈춰 있으면) 안 보내요
      if(lobby)await ch.track(Object.assign({at:Date.now()},state));else sendSoon();fire();},
    onPeers:(h,onErr)=>{hs.push(h);setTimeout(fire,0);ready.catch(()=>onErr&&onErr());return()=>{};},
    peers:list,
    join:async name=>{const c=supaChannel(client,'ht-'+name,myId,false);await c.ready;return c;}};
}

function makeAiShim(){

    let r;try{r=await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/functions/v1/'+(CFG.aiFunction||'ai'),{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+CFG.supabaseAnonKey,apikey:CFG.supabaseAnonKey},body:JSON.stringify({messages})});}
    catch(e){throw{code:'network'};}
    if(r.status===429)throw{code:'rate_limited'};if(!r.ok)throw{code:'server_'+r.status};
    const j=await r.json();return String(j.text||'');};
  const fn=async input=>({text:await call(input),truncated:false});
  fn.json=async input=>{const t=await call(input);const m=t.match(/\{[\s\S]*\}/);if(!m)throw{code:'bad_json'};return JSON.parse(m[0]);};
  return fn;
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const toTok=w=>w[0]==='+'?{t:w.slice(1),a:true}:{t:w,a:false};
// 대답하는 사람의 카드 (정답 + 헷갈리는 카드 1~2장)
function ansSet(kind,h){
  const pk=pko(h),vb=V(h,'pl');
  if(kind==='hobby')return{cards:['제','취미는',h,'+'+(bat(h)?'이에요':'예요'),'+'+(bat(h)?'예요':'이에요'),pk],ok:['제 취미는 '+cop(h),'저는 '+eul(h)+' 좋아해요','제 취미는 '+cop(h)+'.']};
  if(kind==='where')return{cards:[pk,'+에서','+에',eul(h),vb,pk==='학교'?'공원':'학교'],ok:[pk+'에서 '+eul(h)+' '+vb,pk+'에서 '+vb]};
  if(kind==='when')return{cards:['토요일','일요일','+에','+에서',eul(h),vb],ok:['토요일','일요일'].map(d=>d+'에 '+eul(h)+' '+vb)};
  if(kind==='propose')return{cards:['네,','좋아요','아니요,','미안해요'],ok:['네, 좋아요','아니요, 미안해요']};
  const ok=[];for(const d of ['토요일','일요일'])for(const t of TIMES)ok.push(d+' '+t[0]+'에 만나요');
  return{cards:['토요일','일요일'].concat(TIMES.map(t=>t[0]),['+에','+에서','만나요']),ok};
}
// 질문하는 사람의 카드
function askSet(kind,h){
  if(kind==='hobby')return{cards:['취미가','취미를','뭐예요?','어디예요?'],ok:['취미가 뭐예요?']};
  if(kind==='where')return{cards:['어디에서','어디에',eul(h),V(h,'pl')+'?'],ok:['어디에서 '+eul(h)+' '+V(h,'pl')+'?']};
  if(kind==='propose')return{cards:['같이',eul(h),V(h,'pr')+'?',V(h,'pl')+'?'],ok:['같이 '+eul(h)+' '+V(h,'pr')+'?']};
  return{cards:['언제','어디에서','만날까요?','만나요?'],ok:['언제 만날까요?']};
}
function parseMeet(t){const day=/일요일/.test(t)?'일요일':'토요일';const m=TIMES.find(x=>t.includes(x[0]));return{day,hour:m?m[1]:15};}
function newBuild(set){return{set,cards:shuffle(set.cards).map(toTok),toks:[],jamo:[],kb:false,shift:false,fb:null,busy:false,tries:0,t0:performance.now()};}

/* ---------- AI (Claude): NPC reactions + flexible checking ---------- */
let sampleFn=null, aiState='loading';
(async()=>{try{sampleFn=await useCap('sample');}catch(e){}aiState=sampleFn?'on':'off';})();
const AI_OFF=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
function persona(e){return (e.persona||'')+(e.country?' (from '+e.country+')':'')+(e.role==='teacher'?' (the Korean teacher)':'');}
// NPC가 학생 대답에 짧게 반응해요. AI가 안 되면 정해진 말로 대신해요.
async function aiReact(e,q,ans){
  const fb=['좋아요!','와, 좋아요!','멋있어요!','네, 좋아요!'][Math.floor(Math.random()*4)];
  if(!sampleFn||aiState==='off')return fb;
  try{
    const r=await sampleFn.json('You are "'+e.name+'", a friendly character in a beginner (A1) Korean class game for teenagers. About you: '+persona(e)+' You asked: "'+q+'". The learner answered: "'+ans+'". Write ONE very short, warm reaction in very easy Korean (at most 14 characters), not a question, Korean only, e.g. "와, 좋아요!", "저도 수영을 좋아해요!", "멋있어요!". Keep it school-appropriate. Reply with ONLY JSON: {"r":"..."}',{modelTier:'quick',cache:false});
    const t=r&&typeof r.r==='string'?r.r.replace(/[?？]/g,'!').trim().slice(0,24):'';return t||fb;
  }catch(err){if(AI_OFF.includes(err&&err.code))aiState='off';return fb;}
}
// 정답 목록에 없으면 AI가 "이것도 맞는 대답인지" 한 번 더 봐요 (키보드로 쓴 대답, 다른 어순 등)
async function checkBuild(b,question,hobby,rerender){
  const txt=buildText(b),n=norm(txt);
  if(b.set.ok.some(o=>norm(o)===n))return{ok:true,text:txt};
  if(sampleFn&&aiState!=='off'&&n.length>1){
    b.busy=true;rerender();
    try{
      const r=await sampleFn.json('Beginner (A1) Korean class game. Question: "'+question+'". A learner answered: "'+txt+'". Model answer: "'+b.set.ok[0]+'". Facts: the learner\'s hobby is '+hobby+'. Is the learner\'s answer correct, natural Korean that answers the question and fits the facts? Ignore spacing and punctuation, but particles (은/는, 을/를, 에/에서, 이에요/예요) must be right. Reply with ONLY JSON: {"ok":true} or {"ok":false}',{modelTier:'quick'});
      b.busy=false;if(r&&r.ok===true)return{ok:true,text:txt,ai:true};
    }catch(err){b.busy=false;if(AI_OFF.includes(err&&err.code))aiState='off';}
  }
  return{ok:false,text:txt,ai:!!(sampleFn&&aiState!=='off')};
}

/* card builder (cards, or the Hangul keyboard behind the pencil button) */
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const VC={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
const FC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
const isC=x=>typeof x==='string'&&x.length===1&&CHO.indexOf(x)>=0, isV=x=>typeof x==='string'&&x.length===1&&JUNG.indexOf(x)>=0;
function compose(a){let o='',i=0;
  while(i<a.length){const x=a[i];
    if(isC(x)&&isV(a[i+1])){let v=a[i+1];i+=2;if(isV(a[i])&&VC[v+a[i]]){v=VC[v+a[i]];i++;}
      let f='';if(isC(a[i])&&JONG.indexOf(a[i])>0&&!isV(a[i+1])){f=a[i];i++;if(isC(a[i])&&FC[f+a[i]]&&!isV(a[i+1])){f=FC[f+a[i]];i++;}}
      o+=String.fromCharCode(0xAC00+(CHO.indexOf(x)*21+JUNG.indexOf(v))*28+JONG.indexOf(f));continue;}
    if(isV(x)&&isV(a[i+1])&&VC[x+a[i+1]]){o+=VC[x+a[i+1]];i+=2;continue;}
    o+=x;i++;}
  return o;}
const KB=[['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['⇧','ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ','⌫']];
const SHIFT={'ㅂ':'ㅃ','ㅈ':'ㅉ','ㄷ':'ㄸ','ㄱ':'ㄲ','ㅅ':'ㅆ','ㅐ':'ㅒ','ㅔ':'ㅖ'};
const tokText=t=>t.reduce((s,x)=>s+(s&&!x.a?' ':'')+x.t,'');
const buildText=b=>(b.kb?compose(b.jamo):tokText(b.toks)).replace(/\s+/g,' ').trim();
function buildUI(b){

  let h='<div class="pv'+(b.fb?(ok?' ok':' bad'):'')+'"><span class="'+(txt?'':'ph')+'">'+(txt?esc(txt):tx(T('buildHint')))+'</span>'+(ok?'<b>'+ic('yes')+'</b>':'<button type="button" data-b="bk" aria-label="지워요">⌫</button>')+'</div>';

  if(!b.kb)h+='<div class="chips">'+b.cards.map((c,i)=>'<button class="chip-c'+(c.a?' att':'')+'" type="button" data-b="c'+i+'">'+(c.a?'+':'')+(ICON[c.t]?'<i>'+icw(c.t)+'</i>':'')+esc(c.t)+'</button>').join('')+'</div>';
  else h+='<div class="kb">'+KB.map(row=>'<div>'+row.map(k=>{const v=b.shift&&SHIFT[k]?SHIFT[k]:k;
      if(k==='⇧')return '<button type="button" class="w2" data-b="shift" aria-pressed="'+b.shift+'" aria-label="Shift">⇧</button>';
      if(k==='⌫')return '<button type="button" class="w2" data-b="bk" aria-label="지워요">⌫</button>';
      return '<button type="button" data-b="k:'+v+'">'+v+'</button>';}).join('')+'</div>').join('')+
      '<div><button type="button" data-b="k:?">?</button><button type="button" class="w5" data-b="k: " aria-label="띄어쓰기">␣</button><button type="button" data-b="k:.">.</button></div></div>';
  h+='<div class="sendrow"><button class="btn ghost kbt" type="button" data-b="kb" aria-label="'+(b.kb?'카드':'키보드')+'">'+(b.kb?ic('cards'):ic('pencil'))+'</button><button class="btn" type="button" data-b="send"'+(txt?'':' disabled')+'>'+ic('speech')+' '+tx(T('send'))+'</button></div>';
  return h;
}
function buildClick(b,btn){
  const k=btn.dataset.b;if(!k||b.busy)return false;
  if(k==='send'){sfx('send');return 'send';}
  if(k==='bk'){if(b.kb)b.jamo.pop();else b.toks.pop();b.fb=null;return true;}
  if(k==='kb'){b.kb=!b.kb;b.toks=[];b.jamo=[];b.fb=null;return true;}
  if(k==='shift'){b.shift=!b.shift;return true;}
  if(k.startsWith('k:')||k[0]==='c'||k==='bk')sfx(k==='bk'?'tap':'pop');
  if(k.startsWith('k:')){if(b.jamo.length<60)b.jamo.push(k.slice(2));b.shift=false;b.fb=null;return true;}
  if(k[0]==='c'){const c=b.cards[+k.slice(1)];if(c&&b.toks.length<12)b.toks.push(c);b.fb=null;return true;}
  return false;
}
function wrong(b,rerender){b.fb={ok:false,fix:b.set.ok[0]};b.toks=[];b.jamo=[];speak(b.set.ok[0]);rerender();}

/* talking to an NPC: the NPC asks, the learner answers with cards */
const NPC_FLOW=['hobby','where','when','propose','meet'];
const convs={};
function npcLine(e,c){const H=me.hobby,NH=e.hobby;
  if(c.stage==='hobby')return '안녕하세요! 취미가 뭐예요?';
  if(c.stage==='where')return '저는 '+eul(NH)+' 좋아해요. 어디에서 '+eul(H)+' '+V(H,'pl')+'?';
  if(c.stage==='when')return '언제 '+eul(H)+' '+V(H,'pl')+'?';
  if(c.stage==='propose')return '저는 '+pko(NH)+'에서 '+act(NH)+'.';
  return '네, 좋아요! 언제 만날까요?';}
function npcSetFor(e,stage){return stage==='propose'?askSet('propose',e.hobby):ansSet(stage,me.hobby);}
function openTalk(e){
  logEv('talk',{with:e.name,kind:e.kind==='peer'?'peer':'npc',visit:!!(visitor&&visitor.n===e)});
  talkTarget=e;sheetKind='talk';sheet.classList.remove('tall');if(player.g)e.g.lookAt(player.g.position.x,0,player.g.position.z);
  if(e.kind==='peer'){let c=pconv[e.key];if(!c)c=pconv[e.key]={stage:'hobby',last:'',done:false,wait:false,pending:null,ph:null,b:newBuild(askSet('hobby'))};renderTalk();return;}
  let c=convs[e.key];if(!c){c=convs[e.key]={stage:'hobby',react:'',done:false,endLine:'',b:newBuild(npcSetFor(e,'hobby'))};delete chats[e.key];chatPush(e,'t',npcLine(e,c));}
  renderTalk();if(!c.done){const l=npcLine(e,c);bubble(e,l);speak((c.react?c.react+' ':'')+l);}
}
function renderTalk(){
  const e=talkTarget;if(!e||sheetKind!=='talk')return;
  let h;
  if(e.kind==='peer'){
    const c=pconv[e.key];h=headTalk(e,PEER_FLOW.indexOf(c.stage),PEER_FLOW.length,c.done);
    const typing=c.wait&&e.typK==='me';
    if(chatOf(e).log.length||typing)h+=chatHtml(e,typing);
    if(c.done){}
    else if(c.wait){if(!typing)h+='<p class="hint">'+tx(T('waitAns',{name:e.name}))+'</p>';}
    else h+='<p class="hint">'+tx(T('askNow'))+'</p>'+buildUI(c.b);
  }else{
    const c=convs[e.key];h=headTalk(e,NPC_FLOW.indexOf(c.stage),NPC_FLOW.length,c.done);
    h+=chatHtml(e,!!c.thinking);
    if(c.done)h+='<div class="endbox"><button class="btn ghost" type="button" data-act="restart">'+tx(T('again'))+'</button></div>';
    else if(!c.thinking){if(c.stage==='propose')h+='<p class="hint">'+tx(T('askNow'))+'</p>';h+=buildUI(c.b);}
  }
  sheet.innerHTML=h;sheet.hidden=false;chatDone(sheet,e);syncTyping();
}
async function npcSend(){
  const e=talkTarget;if(!e)return;const c=convs[e.key],b=c.b;const q=npcLine(e,c),st=c.stage;
  const res=await checkBuild(b,q,me.hobby,renderTalk);ansLog('npc',q,b,res,{stage:st,npc:e.name,role:e.role||''});
  if(convs[e.key]!==c||c.b!==b)return;
  if(!res.ok){wrong(b,renderTalk);return;}
  b.fb={ok:true};sayMe(res.text);chatPush(e,'me',res.text);c.thinking=true;renderTalk();
  if(st==='hobby'&&!prog.interviews[e.key]){prog.interviews[e.key]={name:e.name,hobby:e.hobby,where:pko(e.hobby)};save();updateMissions();}
  let endLine='';
  if(st==='meet'){const m=parseMeet(res.text);prog.appt={key:e.key,name:e.name,act:e.hobby,partnerHobby:e.hobby,place:HOB[e.hobby].place,day:m.day,hour:m.hour};save();updateMissions();
    endLine=apptText(m.day,m.hour,prog.appt.place).t+' 만나요! :smile:';toastMsg(ic('promise')+' '+esc(apptText(m.day,m.hour,prog.appt.place).t)+' 만나요.',tx(T('promise')));}
  else if(st==='when'&&(e.role==='teacher'||(prog.appt&&prog.appt.key!==e.key)))endLine=e.role==='teacher'?'친구하고 같이 해요 :smile:':'만나서 반가워요! :smile:';
  const react=await aiReact(e,st==='propose'?res.text:q,res.text);
  await new Promise(r=>setTimeout(r,600));
  if(convs[e.key]!==c)return;c.thinking=false;
  if(endLine){c.done=true;c.endLine=react+' '+endLine;}
  else{c.stage=NPC_FLOW[NPC_FLOW.indexOf(st)+1];c.react=react;c.b=newBuild(npcSetFor(e,c.stage));}
  const say=c.done?c.endLine:(c.react+' '+npcLine(e,c));bubble(e,say);speak(say);chatPush(e,'t',say);
  if(talkTarget===e)renderTalk();
}

/* talking to a classmate: the one who taps asks with question cards; the friend answers with answer cards */
const PEER_FLOW=['hobby','where','propose','meet'];
const pconv={};
function peerSend(){
  const e=talkTarget;if(!e)return;const c=pconv[e.key],b=c.b;const txt=buildText(b);
  const okp=b.set.ok.some(o=>norm(o)===norm(txt));ansLog('peer_ask','(친구에게 묻기) '+c.stage,b,{ok:okp,text:txt},{stage:c.stage,to:e.name});
  if(!okp){wrong(b,renderTalk);return;}
  b.fb={ok:true};sayMe(txt);chatPush(e,'me',txt);
  const ts=Date.now();c.wait=true;c.pending={ts,kind:c.stage};syncTyping();

function peerGotReply(e,r){
  const c=pconv[e.key];if(!c||!c.pending)return;const st=c.pending.kind;c.pending=null;c.wait=false;

  if(st==='hobby'&&HK.includes(r.h)){c.ph=r.h;e.hobby=r.h;prog.interviews[e.key]={name:e.name,hobby:r.h,where:pko(r.h)};save();updateMissions();}

  if(c.done)chatPush(e,'sys',c.endLine);

}

let typSent='',typPing=0;const TYP_TTL=45000;

function typingPing(){if(!typSent)return;const n=performance.now();if(n-typPing<4000)return;typPing=n;const [to,k]=typSent.split('|');pub({typ:{to,k,ts:Date.now()}});}

setInterval(()=>{const n=performance.now();let ch=false;for(const e of peers.values())if(e.typK&&n-(e.typAt||0)>TYP_TTL){e.typK='';if(e.typTag){untag(e.typTag);e.typTag=null;}ch=true;}if(ch)typingChanged();},1000);
function syncTyping(){let t=null;
  try{
    if(!promptEl.hidden&&promptQ[0]&&!(pb&&pb.fb&&pb.fb.ok))t={to:promptQ[0].from.peer,k:'ans'};
    else if(!sheet.hidden&&sheetKind==='talk'&&talkTarget&&talkTarget.kind==='peer'){const c=pconv[talkTarget.key];if(c&&!c.wait&&!c.done)t={to:talkTarget.peer,k:'ask'};}
  }catch(e){return;}
  const key=t?t.to+'|'+t.k:'';if(key===typSent)return;typSent=key;typPing=performance.now();if(t)t.ts=Date.now();pub({typ:t});}

/* ---------- 장소 활동: ① 무엇을 해요? (에서) ② 언제 해요? (부터·까지) ---------- */
const HRS=['한','두','세','네','다섯','여섯','일곱','여덟','아홉','열','열한','열두'];
function timeSet(h){const o=eul(h),v=V(h,'pl'),ok=[];
  const hs=['두','세','네','다섯'];
  for(const ap of ['','오전 ','오후 '])for(let a=0;a<hs.length;a++)for(let b=a+1;b<hs.length;b++)ok.push(ap+hs[a]+' 시부터 '+hs[b]+' 시까지 '+o+' '+v);
  return{cards:['오전','오후'].concat(hs.map(x=>x+' 시'),['+부터','+까지','+에',o,v]),ok,fix:'오후 세 시부터 네 시까지 '+o+' '+v};}
function parseSpan(t){const m=norm(t).match(/(오전|오후)?(한|두|세|네|다섯|여섯|일곱|여덟|아홉|열한|열두|열)시부터(한|두|세|네|다섯|여섯|일곱|여덟|아홉|열한|열두|열)시까지/);
  if(!m)return{a:15,b:16,ap:'오후'};const pm=m[1]!=='오전';const toH=w=>{const n=HRS.indexOf(w)+1;return pm&&n<12?n+12:n;};return{a:toH(m[2]),b:toH(m[3]),ap:m[1]||''};}
let actS=null, clockRun=null;

async function actSend(){

  if(!res.ok){b.fb={ok:false,fix:a.step==='time'?b.set.fix:b.set.ok[0]};b.toks=[];b.jamo=[];speak(b.fb.fix);renderAct();return;}

function applyPose(ent,a,now,dt,isMe){
  const g=ent.g,sp=a.spot,t=(now-a.t0)/1000,u=g.userData;
  g.rotation.x=0;
  switch(sp.pose){
    case 'sit':g.position.set(sp.x,.28,sp.z);g.rotation.y=sp.face;animWalk(g,false,now);
      if(u.hands)u.hands[0].position.y=u.hands[1].position.y=.78+Math.abs(Math.sin(t*8))*.06;break;
    case 'cook':g.position.set(sp.x,0,sp.z);g.rotation.y=sp.face;if(u.hands){u.hands[1].position.y=.85+Math.sin(t*7)*.12;}
      if(isMe&&(ent._lf=(ent._lf||0)+dt)>.8){ent._lf=0;floatIcon('think',new THREE.Vector3(-12.6,1.6,27.2));}break;
    case 'sing':g.position.set(sp.x,Math.abs(Math.sin(t*5))*.12,sp.z);g.rotation.y=sp.face;if(u.hands)u.hands[0].position.y=1.05;
      if((ent._lf=(ent._lf||0)+dt)>.55){ent._lf=0;floatIcon('music',g.position.clone().add(new THREE.Vector3((Math.random()-.5)*1.2,2.2,0)));}break;
    case 'swim':{const ph=t*.55;g.position.set(sp.x+Math.sin(ph)*3,-.78+Math.sin(t*4)*.05,sp.z);g.rotation.y=Math.cos(ph)>0?Math.PI/2:-Math.PI/2;
      if(u.hands){u.hands[0].position.y=.7+Math.sin(t*6)*.35;u.hands[1].position.y=.7-Math.sin(t*6)*.35;}break;}
    case 'shoot':{g.position.set(sp.x,0,sp.z);g.rotation.y=sp.face;const q=(t%1.5)/1.5;
      if(u.hands)u.hands[0].position.y=u.hands[1].position.y=q<.15?1.2:.7;
      if(isMe&&actBall){const from=new THREE.Vector3(sp.x-.4,1.6,sp.z),to=new THREE.Vector3(-24.45,3.05,15);
        if(q<.75){const k=q/.75;actBall.position.lerpVectors(from,to,k);actBall.position.y+=Math.sin(k*Math.PI)*2.2;}else{const k=(q-.75)/.25;actBall.position.set(-24.45,3.05-k*2.8,15);}}break;}
    case 'kick':{g.position.set(sp.x-Math.max(0,Math.sin((t%1.6)/1.6*Math.PI*2))*.15,0,sp.z);g.rotation.y=sp.face;animWalk(g,(t%1.6)<.3,now);
      if(isMe&&actBall){const k=(t%1.6)/1.6;actBall.position.set(sp.x+.6+k*3.3,.28+Math.sin(k*Math.PI)*.6,sp.z+Math.sin(k*9)*.15);}break;}
    case 'jump':{g.position.set(sp.x,Math.abs(Math.sin(t*4.5))*.7,sp.z);g.rotation.y=sp.face;if(u.hands){const up=Math.abs(Math.sin(t*4.5));u.hands[0].position.y=u.hands[1].position.y=.7+up*.7;}break;}
    case 'walkloop':{const ang=t*.45,cx=-19,cz=-4;g.position.set(cx+Math.cos(ang)*3,0,cz+Math.sin(ang)*3);g.rotation.y=Math.atan2(-Math.sin(ang),Math.cos(ang));animWalk(g,true,now);break;}
    case 'climb':{const k=(t%12)/12,sx=sp.x,sz=sp.z,dx=SUMMIT.x-sx,dz=SUMMIT.z-sz,L=Math.hypot(dx,dz),go=Math.min(k*1.25,1)*(L-3.4);
      const x=sx+dx/L*go,z=sz+dz/L*go,d=Math.hypot(x-SUMMIT.x,z-SUMMIT.z);g.position.set(x,Math.max(0,12*(1-d/8))-.1,z);g.rotation.y=Math.atan2(dx,dz);animWalk(g,k<.8,now);break;}
    case 'ride':{const per=14,k=(t%per)/per,f=k<.5?k*2:2-k*2;g.position.set(9.5+f*26,.4,sp.z);g.rotation.y=k<.5?Math.PI/2:-Math.PI/2;animWalk(g,true,now);break;}
  }
}

/* ---------- input ---------- */
// 위치는 계속 보내지 않고 '가려는 곳'만 한 번 보내요 (접속자가 많아도 메시지가 적게 나가요)
function pubDest(x,z){pub({x:Math.round(x*10)/10,z:Math.round(z*10)/10});}
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let down=null, pendingTalk=null, pendingSpot=null;
const ground=new THREE.Plane(new THREE.Vector3(0,1,0),0);
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};busyNow();if(!$('#emoTray').hidden)setTray(false);if(feedOpen)setFeed(false);});
document.addEventListener('pointerdown',busyNow,true);
canvas.addEventListener('pointerup',e=>{
  if(!down||!player.g)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved>12)return;
  const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(pickables,true)[0];
  if(hit){let o=hit.object;while(o&&!(o.userData&&o.userData.ref))o=o.parent;const ref=o&&o.userData.ref;
    if(ref&&ref.kind==='obj'){openObj(ref);return;}
    if(ref&&ref.kind==='spot'){const sp=ref.spot;if(d2(player.g.position,sp.x,sp.z)<=1.8&&!player.act){openAct(sp);}else{stopAct();pendingTalk=null;pendingSpot=sp;player.target=new THREE.Vector3(sp.x,0,sp.z);pubDest(sp.x,sp.z);}return;}
    if(ref){stopAct();pendingSpot=null;if(d2(player.g.position,ref.g.position.x,ref.g.position.z)<=2.8){player.target=null;openTalk(ref);}else{pendingTalk=ref;player.target=ref.g.position.clone();pubDest(ref.g.position.x+1.2,ref.g.position.z+1.2);}return;}}
  const pt=new THREE.Vector3();if(game.on)return;
  // 화면 맨 위(먼 곳·하늘 쪽)를 눌러도 그 방향 끝까지 가요
  let okHit=!!ray.ray.intersectPlane(ground,pt);
  if(!okHit||pt.distanceTo(camera.position)>90){const d=ray.ray.direction.clone();d.y=0;if(d.lengthSq()>1e-6){d.normalize();pt.copy(player.g.position).addScaledVector(d,30);pt.y=0;okHit=true;}}
  if(okHit){pendingTalk=null;pendingSpot=null;stopAct();
    pt.x=Math.max(-38,Math.min(38,pt.x));pt.z=Math.max(-38,Math.min(38,pt.z));player.target=pt;marker.position.set(pt.x,.07,pt.z);marker.visible=true;sfx('tap');pubDest(pt.x,pt.z);
    if(sheetKind==='talk'||sheetKind==='obj'||sheetKind==='act')closeSheet();}
});

/* ---------- loop ---------- */
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
const camOff=()=>camera.aspect<.8?new THREE.Vector3(0,27,21):new THREE.Vector3(0,20,17);
let coverAt=0,coverPx=0,viewShift=0;
const camLook=new THREE.Vector3(0,0,-8);camera.position.copy(camLook).add(camOff());camera.lookAt(camLook);
let last=performance.now(), insidePlace=null, meetCheck=0, clockT=0, zoom=1;
const tmp=new THREE.Vector3();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(player.g){
    const p=player.g.position;
    if(game.moving&&!player.target){if(game.path.length){const t=game.path.shift();player.target=new THREE.Vector3(t.x,0,t.z);}else{game.moving=false;onLand();}}
    if(pendingSpot&&d2(p,pendingSpot.x,pendingSpot.z)<=.4){const sp=pendingSpot;pendingSpot=null;player.target=null;marker.visible=false;openAct(sp);}
    if(pendingTalk){player.target=pendingTalk.g.position.clone();if(d2(p,player.target.x,player.target.z)<=2.6){const t=pendingTalk;pendingTalk=null;player.target=null;openTalk(t);}}
    if(player.target){const dx=player.target.x-p.x,dz=player.target.z-p.z,dist=Math.hypot(dx,dz);
      if(dist<.15){player.target=null;marker.visible=false;}else{const s=Math.min(dist,(game.moving?9:6.5)*dt);p.x+=dx/dist*s;p.z+=dz/dist*s;player.g.rotation.y=Math.atan2(dx,dz);p.y=Math.abs(Math.sin(now/95))*.08;pubDirty=true;}}
    else if(!player.act)p.y=0;
    if(player.act)applyPose(player,player.act,now,dt,true);else animWalk(player.g,!!player.target,now);
    // place enter
    let inside=null;for(const pl of PLACES){if(d2(p,pl.x,pl.z)<=pl.r){inside=pl;break;}}
    if(inside&&inside!==insidePlace){
      const s=timeFull()+'에 '+inside.ko+'에서 '+inside.act+'.';
      toastMsg(timeFull()+G('에')+' '+esc(inside.ko)+G('에서')+' '+inside.act+'.',icw(inside.ko)+' '+esc(inside.ko),s);
      logEv('place',{p:inside.id});if(!prog.visited.includes(inside.id)){prog.visited.push(inside.id);save();updateMissions();}
    }
    insidePlace=inside;
    const nearCourt=d2(p,P.court.x,P.court.z)<14;myRing.visible=minuRing.visible=nearCourt;myRing.position.set(p.x,.08,p.z);
    const inRoom=insidePlace&&insidePlace.room?insidePlace.id:null;
    for(const r of ROOMS){const tg=r.id===inRoom?.14:1;r.o+=(tg-r.o)*Math.min(1,dt*6);for(const m of r.mats){m.opacity=r.o;m.depthWrite=r.o>.95;}}
    // 대화 중이면: 나와 상대 가운데를 보고, 화면이 대화창에 가린 만큼 장면을 위로 올려요
    const partner=!sheet.hidden&&talkTarget&&talkTarget.g?talkTarget:(!promptEl.hidden&&promptQ[0]&&promptQ[0].from.g?promptQ[0].from:null);
    if(now-coverAt>150){coverAt=now;let top=innerHeight;for(const el of [sheet,promptEl])if(!el.hidden){const r=el.getBoundingClientRect();if(r.height>0)top=Math.min(top,r.top);}coverPx=Math.min(innerHeight*.72,innerHeight-top);}
    viewShift+=(coverPx*.5-viewShift)*Math.min(1,dt*5);
    if(viewShift>1)camera.setViewOffset(innerWidth,innerHeight,0,viewShift,innerWidth,innerHeight);else if(camera.view&&camera.view.enabled)camera.clearViewOffset();
    zoom+=((inRoom?.58:partner?.7:player.act?.78:1)-zoom)*Math.min(1,dt*3);
    if(partner)tmp.set((p.x+partner.g.position.x)/2,0,(p.z+partner.g.position.z)/2);else tmp.set(p.x,0,p.z);
    camLook.lerp(tmp,Math.min(1,dt*4));camera.position.copy(camLook).add(camOff().multiplyScalar(zoom));camera.lookAt(camLook);
    // meeting
    meetCheck+=dt;if(meetCheck>.5){meetCheck=0;const a=prog.appt;
      if(a&&!prog.met){const pl=P[a.place];const partner=entByKey(a.key);
        if(partner&&d2(p,pl.x,pl.z)<=pl.r+1&&d2(partner.g.position,pl.x,pl.z)<=pl.r+2){prog.met=true;save();updateMissions();
          bubble(player,'안녕! 같이 '+act(a.act)+'!');if(partner.kind==='npc')bubble(partner,'네, 같이 '+act(a.act)+'!');
          toastMsg(tx(T('met')),'');setTimeout(openReport,1400);}}}
      }
  for(const e of peers.values()){const g=e.g.position;if(e.act){applyPose(e,e.act,now,dt,false);continue;}if(e.tx!=null){const dx=e.tx-g.x,dz=e.tz-g.z,dist=Math.hypot(dx,dz);

  const q=v=>{const t=String(v==null?'':v);return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
  const lines=[cols.join(',')].concat(dashEv.map(e=>{const d=e.d||{};return [new Date(e.ts).toISOString(),e.sid,e.name,e.cty,e.town,e.type,d.ctx||'',d.q||'',d.exp||'',d.said||'',d.ok===undefined?'':(d.ok?1:0),d.tries||'',d.mode||'',d.ai?1:'',d.ms||'',d.h||d.hobby||'',d.p||d.place||d.spot||'',e.type==='answer'?'':evLine(e)].map(q).join(',');}));
  const data='﻿'+lines.join('\n'),fn='hobby-town-log-'+(dashDay&&dashDay!=='all'?dashDay:'all')+'.csv';
  if(!DEPLOYED){try{const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:fn,data});return;}}catch(e){return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();
};
// 주소 끝에 #teacher 또는 ?teacher 를 붙이면 분석 화면이 열려요 (이미 열린 페이지에서 주소만 바꿔도 열려요)
const isTeacher=()=>location.hash==='#teacher'||/[?&]teacher\b/.test(location.search);
if(DEPLOYED&&isTeacher()){openDash();}
window.addEventListener('hashchange',()=>{if(DEPLOYED&&isTeacher()&&$('#dash').hidden)openDash();});

/* ---------- intro ---------- */
const sw=$('#swatches');
function drawSw(){sw.innerHTML=COLORS.map(c=>'<button class="sw" type="button" style="background:'+c+'" data-c="'+c+'" aria-label="'+c+'" aria-pressed="'+(picked.color&&c===me.color)+'"></button>').join('');}
sw.onclick=e=>{const b=e.target.closest('[data-c]');if(b){me.color=b.dataset.c;picked.color=true;drawSw();checkNeed(false);}};drawSw();
function drawHobby(){if(!picked.hobby){$('#hName').innerHTML='<span class="qmark">?</span>';$('#hEn').innerHTML=ic('tap')+' 아래에서 골라요';return;}
  const pl=pko(me.hobby);$('#hName').innerHTML=icw(me.hobby)+esc(me.hobby);$('#hEn').innerHTML=icw(pl)+' '+esc(pl)+'에서 '+esc(act(me.hobby));}
function drawHGrid(){$('#hgrid').innerHTML=HK.map(h=>'<button class="hb" type="button" data-h="'+h+'" aria-pressed="'+(picked.hobby&&h===me.hobby)+'">'+icw(h)+esc(h)+'</button>').join('');}
drawHobby();drawHGrid();
$('#hgrid').onclick=ev=>{const b=ev.target.closest('[data-h]');if(!b)return;me.hobby=b.dataset.h;picked.hobby=true;if(me.name)logEv('hobby',{h:me.hobby});drawHobby();drawHGrid();speak(me.hobby);checkNeed(false);};
$('#countries').innerHTML=COUNTRIES.map((c,i)=>(c.r&&(i===0||COUNTRIES[i-1].r!==c.r)?'<h3 class="creg">'+esc(c.r)+'</h3>':(!c.r?'<h3 class="creg"></h3>':''))+'<button class="cty" type="button" data-cty="'+c.id+'" aria-pressed="'+(c.id===me.country)+'"><span class="f">'+c.f+'</span><b>'+esc(c.n)+'</b><small>'+esc(c.ko)+'</small></button>').join('');
function showStep2(){const c=ctyOf();$('#step1').hidden=true;$('#step2').hidden=false;$('#ctyTitle').textContent=c.f+' '+c.ko;
  applyI18n();$('#nick').placeholder=T('namePh');$('#soundMsg').textContent='';}
$('#countries').onclick=ev=>{const b=ev.target.closest('[data-cty]');if(!b)return;me.country=b.dataset.cty;me.lang=ctyOf().l;save();showStep2();};
$('#back').onclick=()=>{$('#step2').hidden=true;$('#step1').hidden=false;};
$('#soundBtn').onclick=()=>{speak('안녕하세요');pickVoice();
  let has=true;try{const vs=speechSynthesis.getVoices();has=!('speechSynthesis' in window)?false:(vs.length===0||!!koVoice);}catch(e){has=false;}
  $('#soundMsg').innerHTML=has?tx(T('soundOk')):tx(T('soundNo'));};
$('#nick').value=me.name;
/* 이름 칸: 화면 속 한글 키보드가 기본. 지구 버튼을 누르면 휴대폰 키보드(내 나라 글자·영어)로 바꿔요 */
const nk={on:true,base:me.name||'',jamo:[],shift:false};
function nkText(){return (nk.base+compose(nk.jamo)).slice(0,12);}
function drawNameKb(){
  const el=$('#nameKb');const btn=$('#nameKbBtn');const inp=$('#nick');
  btn.setAttribute('aria-pressed',String(nk.on));btn.innerHTML=nk.on?ic('globe')+' ABC':ic('pencil')+' 한글';
  inp.readOnly=nk.on;inp.inputMode=nk.on?'none':'text';
  if(!nk.on){el.hidden=true;return;}
  el.hidden=false;
  el.innerHTML=KB.map(row=>'<div>'+row.map(k=>{const v=nk.shift&&SHIFT[k]?SHIFT[k]:k;
      if(k==='⇧')return '<button type="button" class="w2" data-nk="shift" aria-pressed="'+nk.shift+'" aria-label="Shift">⇧</button>';
      if(k==='⌫')return '<button type="button" class="w2" data-nk="bk" aria-label="지워요">⌫</button>';
      return '<button type="button" data-nk="k:'+v+'">'+v+'</button>';}).join('')+'</div>').join('')+
    '<div><button type="button" class="w5" data-nk="k: " aria-label="띄어쓰기">␣</button></div>';
}
$('#nameKb').addEventListener('click',ev=>{const b=ev.target.closest('[data-nk]');if(!b)return;const k=b.dataset.nk;
  if(k==='shift'){nk.shift=!nk.shift;}
  else if(k==='bk'){if(nk.jamo.length)nk.jamo.pop();else nk.base=nk.base.slice(0,-1);}
  else if(k.startsWith('k:')&&nkText().length<12){const c=k.slice(2);if(c===' '){nk.base=nkText()+' ';nk.jamo=[];}else nk.jamo.push(c);nk.shift=false;}
  $('#nick').value=nkText();drawNameKb();checkNeed(false);});
$('#nick').addEventListener('input',()=>checkNeed(false));
$('#nameKbBtn').onclick=()=>{if(nk.on){nk.base=nkText();nk.jamo=[];nk.on=false;drawNameKb();$('#nick').focus();}
  else{nk.base=$('#nick').value.slice(0,12);nk.jamo=[];nk.on=true;$('#nick').blur();drawNameKb();}};
$('#nick').addEventListener('input',()=>{if(!nk.on){nk.base=$('#nick').value;}});
drawNameKb();
// 처음 화면은 항상 나라 고르기예요 (전에 고른 나라는 눌린 채로 보여요)
applyI18n();
// 설명(게임 가이드): 게임은 그대로 두고 위에 설명 페이지를 띄워요
function openGuide(){const f=$('#guideFr');if(!f.getAttribute('src'))f.src='guide/index.html';setTray(false);if(feedOpen)setFeed(false);$('#guideOv').hidden=false;logEv('guide',{});sfx('pop');}
function closeGuide(){$('#guideOv').hidden=true;}
$('#guideBtn').onclick=openGuide;$('#guideX').onclick=closeGuide;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#guideOv').hidden)closeGuide();});
$('#sndBtn').onclick=()=>{audioInit();if(AC)AC.resume().catch(()=>{});sndMode=(sndMode+2)%3;try{localStorage.setItem('ht-snd',String(sndMode));}catch(e){}soundApply();sfx('pop');
  toastMsg(ic(sndMode===2?'music':sndMode===1?'spk':'phoneoff')+' '+['소리 꺼요','효과음만','음악 + 효과음'][sndMode],'');};
// 들어가기 전에 빠진 것을 알려 줘요: 이름 · 색깔 · 취미
function checkNeed(show){const miss=[];
  if(!$('#nick').value.trim())miss.push({el:$('#nick'),box:$('#nick').closest('.field'),t:ic('pencil')+' 이름을 써 주세요'});
  if(!picked.color)miss.push({el:$('#swatches'),box:$('#swatches').closest('.field'),t:ic('palette')+' 색깔을 골라 주세요'});
  if(!picked.hobby)miss.push({el:$('#hgrid'),box:$('#hgrid').closest('.field'),t:ic('cards')+' 취미를 골라 주세요'});
  const m=$('#needMsg');
  if(!miss.length){m.hidden=true;return true;}
  if(show||!m.hidden){m.innerHTML=miss.map(x=>'<div>'+x.t+'</div>').join('');m.hidden=false;}
  if(show){miss.forEach(x=>{x.box.classList.remove('needbox');void x.box.offsetWidth;x.box.classList.add('needbox');setTimeout(()=>x.box.classList.remove('needbox'),1600);});
    miss[0].box.scrollIntoView({behavior:'smooth',block:'center'});sfx('no');}
  return false;}
$('#start').onclick=()=>{
  audioInit();
  if(!checkNeed(true)){if(!$('#nick').value.trim()&&!nk.on)$('#nick').focus();return;}
  const n=$('#nick').value.trim().slice(0,12);
  me.name=n;save();logEv('join',{hobby:me.hobby,color:me.color,lang:(navigator.language||'').slice(0,10)});
  player.g=makeAvatar(me.color,me.name);player.g.position.set(0,0,-8);
  tag('name me',esc(ctyOf().f+' '+me.name),()=>player.g.position,2.35);
  soundStart();
  $('#intro').hidden=true;$('#emoBar').hidden=false;$('#gameBtn').hidden=false;speak('안녕하세요');applyI18n();updateMissions();updPeople();
  connectRoom().then(()=>{pub({name:me.name,color:me.color,hobby:me.hobby,cty:me.country,x:0,z:-8});pubGame();});
  toastMsg(tx(T('startToast')),'');$('#feed').hidden=false;feed(ic('e_hi')+' '+meWho()+': 안녕하세요!');
};
})();
</script>
