<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>한국어 취미 마을</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-screen 3D town; HUD chips pinned top, one bottom sheet for every conversation, textbook-style yellow marker on grammar points */
:root{
  --ink:#17233b; --muted:#5a6680; --paper:#ffffff; --tint:#eef4fb; --line:#d5deea;
  --accent:#1c5bd0; --accent-ink:#ffffff; --mark:#ffe169; --ok:#1d8f50; --bad:#cf3f36;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#bfe3ee;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;will-change:transform}
.place{font-family:var(--display);font-size:16px;color:var(--ink);text-align:center;line-height:1.05;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff}
.place small{display:block;font-family:var(--body);font-size:10px;color:var(--muted)}
.place.done::after{content:"✓";display:inline-block;margin-left:3px;color:var(--ok)}
.name{font-size:12px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.name.me{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.name.npc{background:#fff8d6;border-color:#e9d78a}
.bubble{background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:14px;
  max-width:190px;white-space:normal;text-align:center;box-shadow:0 2px 0 var(--ink)}
.obj{font-size:12px;font-weight:700;background:#fff;border:1.5px dashed var(--accent);color:var(--accent);border-radius:8px;padding:1px 6px}
.g{background:linear-gradient(transparent 45%,var(--mark) 45%);font-weight:700}

.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);
  display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.hud > *{pointer-events:auto}
.chip{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:14px;padding:6px 10px;font-size:13px;box-shadow:0 2px 8px rgba(23,35,59,.12)}
.clock b{font-family:var(--display);font-weight:400;font-size:15px;display:block}
.clock span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.hud-r{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:700}
.btn.ghost{background:var(--tint);color:var(--ink)}
.btn:focus-visible,.say:focus-visible,.chipbtn:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.chipbtn{border:1px solid var(--line);background:rgba(255,255,255,.94);border-radius:14px;padding:6px 10px;font-size:13px;box-shadow:0 2px 8px rgba(23,35,59,.12)}
.chipbtn b{color:var(--accent)}

.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--paper);border-radius:18px 18px 0 0;
  box-shadow:0 -6px 24px rgba(23,35,59,.18);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-height:72%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#sheet{z-index:6}
#prompt{z-index:7;border-top:4px solid var(--mark)}
.sh-head{display:flex;align-items:center;gap:8px}
.sh-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;flex:1;min-width:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid var(--ink)}
.x{border:0;background:var(--tint);border-radius:10px;width:34px;height:34px;font-size:18px}
.log{display:flex;flex-direction:column;gap:6px}
.ln{max-width:85%;padding:7px 11px;border-radius:14px;font-size:15px;line-height:1.45;background:var(--tint)}
.ln.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.ln.me .g{color:var(--ink)}
.ln.sys{align-self:center;background:none;color:var(--muted);font-size:13px;padding:0}
.says{display:flex;flex-direction:column;gap:8px}
.say{text-align:left;border:1.5px solid var(--ink);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.4;box-shadow:0 2px 0 var(--ink)}
.say:active{transform:translateY(2px);box-shadow:none}
.say[disabled]{opacity:.45;box-shadow:none}
.say small{display:block;font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.fb{font-size:14px;border-radius:10px;padding:8px 10px;line-height:1.5}
.fb.ok{background:#e4f5ea;color:var(--ok)}
.fb.bad{background:#fbe8e6;color:var(--bad)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.pick{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:14px}
.pick[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.big{font-size:19px;line-height:1.5}
.free{display:flex;gap:6px;align-items:center}
.free input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:12px;color:var(--ink);background:var(--paper)}
.free .btn{padding:10px 12px;white-space:nowrap}
.free .btn[disabled]{opacity:.5}
.ai{font-size:11px;font-weight:700;background:var(--ink);color:#fff;border-radius:6px;padding:3px 6px;flex:none}
.ln small{display:block;opacity:.72;font-size:12px;margin-top:2px}
.ln.fix{align-self:flex-end;background:#fff4cc;color:var(--ink);font-size:14px;max-width:92%}
.mini{border:0;background:none;font-size:15px;padding:0 0 0 4px;vertical-align:middle;line-height:0}
.label{font-size:12px;letter-spacing:.04em;color:var(--muted)}

#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 66px);width:min(92%,460px);
  background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:0 3px 0 var(--ink);display:flex;gap:10px;align-items:center}
#toast .tx{flex:1;min-width:0}
#toast .tx p{margin:0;font-size:16px;line-height:1.45}
#toast .tx small{color:var(--muted);font-size:12px}
.spk{border:0;background:var(--mark);border-radius:10px;width:44px;height:44px;flex:none;line-height:0}

.ms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ms li{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:12px}
.ms li.done{background:#f0f9f3;border-color:#bfe3cc}
.ms .n{font-family:var(--display);font-size:16px;width:24px;flex:none;color:var(--accent)}
.ms li.done .n{color:var(--ok)}
.ms b{display:block;font-size:15px}
.ms span{font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:var(--tint);font-weight:700}

#intro{position:fixed;inset:0;background:rgba(191,227,238,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{background:var(--paper);border-radius:20px;max-width:420px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(23,35,59,.25);max-height:100%;overflow-y:auto}
.card h1{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15}
.card p{margin:0;line-height:1.55;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field textarea{font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;color:var(--ink);background:var(--paper);resize:vertical}
.field input{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;color:var(--ink);background:var(--paper)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.hcard{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--accent);border-radius:14px;padding:12px}
.hcard b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--accent)}
.hcard div{flex:1}
.namerow{display:flex;gap:6px;align-items:center}.namerow input{flex:1;min-width:0;font-size:19px}
.namerow .pick{white-space:nowrap}
#nick.need{border-color:var(--bad);animation:shake .12s linear 4}
#nameKb button{height:40px}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (min-width:560px){.hgrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.hb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-size:14px}
.hb .ico{width:34px;height:34px;filter:drop-shadow(0 0 1.2px #fff) drop-shadow(0 1.5px 1.5px rgba(23,35,59,.2))}
.hb[aria-pressed="true"]{border-color:var(--accent);background:var(--tint);font-weight:700}
.countries{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cty{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper)}
.cty .f{font-size:30px;line-height:1.1}
.cty b{font-size:14px;text-align:center;line-height:1.25}
.cty small{font-size:11px;color:var(--muted)}
.cty[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
select{font:inherit;font-size:15px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);max-width:60%}
.sheet.tall{height:min(88%,780px);max-height:none;overflow:hidden}
.sheet.tall > *{flex:none}
.sheet.tall .log{flex:1 1 auto;min-height:56px;overflow-y:auto;padding-right:2px}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.qbtn{flex:none;border:1.5px solid var(--ink);background:var(--paper);border-radius:12px;padding:6px 11px;font-size:14px;white-space:nowrap;text-align:left;line-height:1.3}
.qbtn small{display:block;font-size:11px;color:var(--muted)}
.modes{display:flex;gap:4px;background:var(--tint);border-radius:12px;padding:3px}
.modes button{flex:1;min-width:0;border:0;background:none;border-radius:9px;padding:7px 4px;font-size:13px;line-height:1.2}
.modes button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 3px rgba(23,35,59,.18);font-weight:700}
.pv{display:flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:12px;padding:8px 8px 8px 12px;min-height:46px}
.pv span{flex:1;min-width:0;font-size:18px;line-height:1.35;word-break:keep-all}
.pv span.ph{color:var(--muted);font-size:14px}
.pv button{border:0;background:var(--tint);border-radius:9px;width:38px;height:34px;font-size:16px;flex:none}
.ctabs{display:flex;gap:4px;overflow-x:auto}
.ctabs button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px}
.ctabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:24vh;overflow-y:auto;padding:2px}
.chip-c{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 10px;font-size:16px;line-height:1.2}
.chip-c i{font-style:normal;margin-right:3px}
.chip-c.att{border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:700}
.chip-c.tg{border-color:var(--ink);background:#fff8d6}
.kb{display:flex;flex-direction:column;gap:5px;user-select:none;-webkit-user-select:none}
.kb div{display:flex;gap:4px}
.kb button{flex:1;min-width:0;height:42px;border:0;border-radius:8px;background:var(--tint);font-size:18px;padding:0}
.kb button.w2{flex:2}.kb button.w5{flex:5}
.kb button[aria-pressed="true"]{background:var(--ink);color:#fff}
.kocard{border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff8d6;display:flex;gap:8px;align-items:center}
.kocard div{flex:1;min-width:0}
.kocard b{display:block;font-size:18px}
.kocard small{color:var(--muted);font-size:13px}
.sendrow{display:flex;gap:6px}
.sendrow .btn{flex:1}
.sendrow .btn[disabled]{opacity:.45}
.note{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px}
.note div{flex:1;min-width:0}.note b{display:block;font-size:15px}.note small{color:var(--muted);font-size:12px}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.qbub{display:flex;gap:10px;align-items:center;background:var(--tint);border-radius:16px;padding:14px 14px 14px 16px}
.qbub div{flex:1;min-width:0;font-size:21px;line-height:1.45;word-break:keep-all}
.pv.ok{border-color:var(--ok);background:#e4f5ea}
.pv.bad{border-color:var(--bad)}
.pv b{font-size:22px;color:var(--ok)}
.fix{display:flex;gap:8px;align-items:center;background:#e4f5ea;color:var(--ok);border-radius:12px;padding:8px 12px;font-size:18px;font-weight:700}
.fix span{flex:1;min-width:0}
.chips .chip-c{font-size:19px;padding:10px 14px}
.kbt{flex:0 0 56px!important;font-size:20px;padding:10px 0}
.endbox{display:flex;flex-direction:column;gap:8px}
.ico{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.3em;flex:none}
.stk,.place .ico,.chip-c i .ico,.hcard .ico,.qbub .ico,.mini .ico,.spk .ico{filter:drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 1.2px #fff) drop-shadow(0 1.5px 1.5px rgba(23,35,59,.22))}
.place .ico{width:30px;height:30px;display:block;margin:0 auto 1px}
.chip-c i{margin-right:4px}.chip-c i .ico{width:1.45em;height:1.45em;vertical-align:-.38em}
.hcard b .ico{width:44px;height:44px;vertical-align:-.35em;margin-right:6px}
.mini .ico,.spk .ico{width:26px;height:26px}
.btn .ico{width:1.35em;height:1.35em}
.cty .f{font-size:30px}
.spotic{pointer-events:none}
.spotic .ico{width:30px;height:30px;animation:bob 1.4s ease-in-out infinite}
.actic{pointer-events:none;background:#fff;border:2px solid var(--ink);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--ink)}
.actic .ico{width:30px;height:30px}
.flo{pointer-events:none}.flo .ico{width:24px;height:24px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#gamePanel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(calc(100% - 96px),420px);z-index:4;background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:0 3px 0 var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
@media (max-width:420px){#gamePanel{left:auto;right:calc(env(safe-area-inset-right,0px) + 10px);transform:none;width:calc(100% - 96px)}}
.gp-top{display:flex;align-items:center;gap:8px}.gp-score{flex:1;font-family:var(--display);font-size:20px}
.gp-score .ico{width:26px;height:26px}
.gp-bar{height:10px;border-radius:999px;background:var(--tint);overflow:hidden}.gp-bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.gp-board{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.gp-board div{display:flex;gap:6px;align-items:center}.gp-board b{color:var(--ink);font-variant-numeric:tabular-nums;margin-left:auto}
.gp-board .me{color:var(--accent);font-weight:700}
.gp-row{display:flex;gap:8px;align-items:center}.gp-row .btn{flex:1}.gp-row .btn[disabled]{opacity:.5}
.die{width:48px;height:48px;flex:none;border:2px solid var(--ink);border-radius:11px;background:#fff;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;gap:1px}
.die i{border-radius:50%;background:transparent;margin:2px}.die i.on{background:var(--bad)}
.die.roll{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}100%{transform:rotate(-12deg)}}
.tile{pointer-events:none;display:flex;align-items:center;gap:2px;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:2px 7px 2px 4px;font-weight:800;font-size:13px}
.tile .ico{width:24px;height:24px}
.plus{pointer-events:none;font-family:var(--display);font-size:30px;color:var(--ok);text-shadow:0 0 3px #fff,0 0 3px #fff}
.qpic{display:flex;justify-content:center;gap:6px;padding:4px 0}.qpic .ico{width:64px;height:64px;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 2px 2px rgba(23,35,59,.25))}
.qpic span{align-self:center;font-family:var(--display);font-size:22px}
#feed{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:2;width:min(64vw,300px);pointer-events:none}
#feed.open{z-index:5;pointer-events:auto;background:rgba(23,35,59,.78);border-radius:14px;padding:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
#feed.up{bottom:calc(env(safe-area-inset-bottom,0px) + 200px)}
#feedList{display:flex;flex-direction:column;gap:3px;max-height:34vh;overflow-y:auto}
.fl{align-self:flex-start;max-width:100%;background:rgba(23,35,59,.72);color:#fff;border-radius:10px;padding:3px 9px;font-size:13px;line-height:1.45;transition:opacity .6s;word-break:keep-all}
#feed.open .fl{background:none;padding:1px 2px;opacity:1!important}
.fl b{font-weight:700}.fl .ico{width:18px;height:18px;vertical-align:-.25em}
.fl i{font-style:normal;color:#ffe169}
.emorow{display:flex;gap:8px;align-items:center}
#feedBtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;box-shadow:0 2px 0 var(--ink);line-height:0;padding:0}
#feedBtn .ico{width:28px;height:28px}#feedBtn[aria-expanded="true"]{background:var(--mark)}
#dash{position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dw{max-width:960px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.dh h1{margin:0;font-family:var(--display);font-weight:400;font-size:26px;flex:1 1 12em;min-width:0;white-space:nowrap}
#dBody{display:flex;flex-direction:column;gap:16px}
.dh .btn{padding:8px 12px;font-size:14px}
.dlogin{display:flex;flex-direction:column;gap:6px;max-width:360px}.dlogin input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile2{border:1px solid var(--line);border-radius:14px;padding:12px}.tile2 span{font-size:13px;color:var(--muted)}.tile2 b{display:block;font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.dgrid{grid-template-columns:1fr}}
.dcard{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dcard h2{margin:0;font-size:16px}.dcard .sub{font-size:12px;color:var(--muted);margin-top:-4px}
.bars{display:flex;flex-direction:column;gap:5px}
.br{display:grid;grid-template-columns:minmax(0,7.5em) 1fr 4.2em;gap:8px;align-items:center;font-size:13px}
.br .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br .lb .ico{width:1.2em;height:1.2em;vertical-align:-.25em}
.br .tr{height:12px;background:var(--tint);border-radius:4px;overflow:hidden}.br .tr i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.br .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.br .v small{color:var(--muted)}
.dt{width:100%;border-collapse:collapse;font-size:13px}.dt th,.dt td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.dt th{font-weight:700;color:var(--muted);font-size:12px}.dt td.n{text-align:right;font-variant-numeric:tabular-nums}
.dt tr.pick{cursor:pointer}.dt tr.pick:hover td{background:var(--tint)}
.bad{color:var(--bad)}.good{color:var(--ok)}
.tl{display:flex;flex-direction:column;gap:3px;font-size:13px;max-height:320px;overflow-y:auto}
.tl div{display:grid;grid-template-columns:4.2em 1fr;gap:6px}.tl time{color:var(--muted);font-variant-numeric:tabular-nums}
.aisum{background:var(--tint);border-radius:12px;padding:12px;font-size:14px;line-height:1.6}
.aisum ul{margin:4px 0 0;padding-left:1.2em}
#emoBar{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:3;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:8px}
#emoBtn{width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);line-height:0;padding:0}
#emoBtn .ico{width:40px;height:40px}
#emoBtn[aria-expanded="true"]{background:var(--mark)}
#emoTray{display:grid;grid-template-columns:repeat(4,52px);gap:6px;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:8px;box-shadow:0 3px 0 var(--ink)}
#emoTray[hidden]{display:none}
#emoTray button{width:52px;height:52px;border:0;background:var(--tint);border-radius:14px;line-height:0;padding:0}
#emoTray button:active{transform:scale(.92)}
#emoTray .ico{width:40px;height:40px}
.emo{pointer-events:none;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.emo .ico{width:62px;height:62px;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 3px 3px rgba(23,35,59,.3))}
@keyframes pop{from{opacity:0;scale:.3}to{opacity:1;scale:1}}
/* 작은 휴대폰: 위쪽 표시를 줄이고, 가로 화면에서는 대화창을 더 길게 */
@media (max-width:420px){
  .hud{gap:6px}.chip{padding:5px 8px}.clock b{font-size:13px}.clock span{display:none}
  .chipbtn{padding:5px 8px;font-size:12px}.chipbtn .ico{width:1.2em;height:1.2em}
  .hud-r{gap:4px}#missionBtn span{display:none}
}
@media (max-height:520px){
  .sheet{max-height:94%}.qbub div{font-size:18px}.qpic .ico{width:44px;height:44px}
  #feedList{max-height:24vh}#feed{bottom:calc(env(safe-area-inset-bottom,0px) + 76px)}
  #gamePanel{padding:8px 10px;gap:6px}.gp-board{display:none}
}
@media (prefers-reduced-motion:reduce){.say:active{transform:none}.spotic .ico{animation:none}.emo{animation:none}}

function stepVisitor(now,dt){
  for(const n of returning){const g=n.g.position,dx=n.home.x-g.x,dz=n.home.z-g.z,d=Math.hypot(dx,dz);
    if(d<.2||(visitor&&visitor.n===n)){if(d<.2){g.x=n.home.x;g.z=n.home.z;animWalk(n.g,false,now);}returning.delete(n);continue;}
    const st=Math.min(d,2.6*dt);g.x+=dx/d*st;g.z+=dz/d*st;n.g.rotation.y=Math.atan2(dx,dz);animWalk(n.g,true,now);}
  if(!visitor){if(canVisit()&&now-lastBusy>12000&&now>visitCool)callVisitor(false);return;}
  const v=visitor,n=v.n,g=n.g.position,pp=player.g.position;
  let tx,tz,sp=3.4;
  if(v.phase==='go'){
    if(player.target||player.act||game.on||!sheet.hidden){endVisit();return;}

}

async function flushLog(keep){

  try{
    if(DEPLOYED){const r=await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/rest/v1/events',{method:'POST',keepalive:!!keep,headers:{'Content-Type':'application/json',apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+CFG.supabaseAnonKey,Prefer:'return=minimal'},
        body:JSON.stringify(rows.map(r=>({ts:new Date(r.ts).toISOString(),sid:r.sid,name:r.name,cty:r.cty,town:r.town,type:r.type,data:r.d})))});if(!r.ok)throw 0;}
    // claude.ai 안에서는 학생마다 자기 문서 하나(events/내 id)에만 쓸 수 있고, 읽기는 선생님(편집자)만 돼요
    else{const d=await logDb(),uid=await logUid();if(!d||!uid)return;LOG.all.push(...rows);if(LOG.all.length>1500)LOG.all.splice(0,LOG.all.length-1500);
      await d.collection('events').doc(uid).set({at:Date.now(),sid:LOG.sid,b:LOG.all});}

}

function loadSupa(){if(!supaP)supaP=new Promise((res,rej)=>{if(window.supabase)return res(window.supabase);const sc=document.createElement('script');
  sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js';sc.onload=()=>res(window.supabase);sc.onerror=rej;document.head.appendChild(sc);});return supaP;}
// Supabase 채널 하나 = 마을 하나. 각자 상태(이름·위치·말풍선…)를 broadcast로 보내고, presence로 누가 있는지 알아요.
function supaChannel(client,topic,myId,lobby){
  const ch=client.channel(topic,{config:{presence:{key:myId},broadcast:{self:false}}});
  const state={},others=new Map(),members=new Set(),hs=[];let lastSend=0,pend=null;
  const list=()=>{const out=[{peer:myId,sameTab:true,isMe:true,kind:'viewer',presence:state}];
    if(lobby){const ps=ch.presenceState();for(const id in ps)if(id!==myId)out.push({peer:id,sameTab:false,isMe:false,kind:'viewer',presence:(ps[id]&&ps[id][0])||{}});return out;}
    for(const id of members)if(id!==myId)out.push({peer:id,sameTab:false,isMe:false,kind:'viewer',presence:others.get(id)||{}});return out;};
  const fire=()=>{const p=list();hs.forEach(h=>{try{h({peers:p})}catch(e){}});};
  const send=()=>{lastSend=Date.now();pend=null;ch.send({type:'broadcast',event:'st',payload:{id:myId,s:state}}).catch(()=>{});};
  // 1초에 최대 2번만 보내요 (무료 한도 아끼기)
  const sendSoon=()=>{const wait=500-(Date.now()-lastSend);if(wait<=0)send();else if(!pend)pend=setTimeout(send,wait);};
  ch.on('broadcast',{event:'st'},({payload})=>{if(!payload||typeof payload.id!=='string'||payload.id===myId)return;others.set(payload.id,payload.s||{});members.add(payload.id);fire();});
  ch.on('presence',{event:'sync'},()=>{const ids=new Set(Object.keys(ch.presenceState()));for(const id of [...members])if(!ids.has(id)){members.delete(id);others.delete(id);}for(const id of ids)members.add(id);fire();});
  if(!lobby)ch.on('presence',{event:'join'},({key})=>{if(key!==myId)setTimeout(send,200+Math.random()*600);});
  const ready=new Promise((res,rej)=>{ch.subscribe(st=>{if(st==='SUBSCRIBED'){ch.track({at:Date.now()}).catch(()=>{});res();}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')rej(new Error(st));});});
  return{ready,
    // 로비(전체 50명)는 presence에 마을 번호만 올려요. 마을(10명 이하) 안에서만 상태를 주고받아요
    presence:async patch=>{const same=Object.keys(patch).every(k=>JSON.stringify(state[k])===JSON.stringify(patch[k]));Object.assign(state,patch);await ready;if(same&&!lobby)return; // 바뀐 게 없으면(멈춰 있으면) 안 보내요
      if(lobby)await ch.track(Object.assign({at:Date.now()},state));else sendSoon();fire();},
    onPeers:(h,onErr)=>{hs.push(h);setTimeout(fire,0);ready.catch(()=>onErr&&onErr());return()=>{};},
    peers:list,
    join:async name=>{const c=supaChannel(client,'ht-'+name,myId,false);await c.ready;return c;}};
}
// AI는 Supabase Edge Function을 거쳐 Claude API로 가요 (API 키는 서버에만 있어요)
function makeAiShim(){
  const call=async input=>{const messages=typeof input==='string'?[{role:'user',content:input}]:input;
    let r;try{r=await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/functions/v1/'+(CFG.aiFunction||'ai'),{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+CFG.supabaseAnonKey,apikey:CFG.supabaseAnonKey},body:JSON.stringify({messages})});}
    catch(e){throw{code:'network'};}
    if(r.status===429)throw{code:'rate_limited'};if(!r.ok)throw{code:'server_'+r.status};
    const j=await r.json();return String(j.text||'');};
  const fn=async input=>({text:await call(input),truncated:false});
  fn.json=async input=>{const t=await call(input);const m=t.match(/\{[\s\S]*\}/);if(!m)throw{code:'bad_json'};return JSON.parse(m[0]);};
  return fn;
}
let supaRoomP=null;
async function useCap(name){
  if(DEPLOYED){
    if(name==='sample')return makeAiShim();
    if(name==='room'){if(!supaRoomP)supaRoomP=(async()=>{const lib=await loadSupa();const client=lib.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{realtime:{params:{eventsPerSecond:20}}});
      const myId='s'+Math.random().toString(36).slice(2,10);const lobby=supaChannel(client,'ht-lobby',myId,true);await lobby.ready;return lobby;})().catch(()=>null);return supaRoomP;}
    return null;
  }
  if(window.claude&&window.claude.use)return window.claude.use(name);
  return null;
}

function validColor(c){return typeof c==='string'&&/^#[0-9a-fA-F]{6}$/.test(c)?c:'#8a93a6';}
function onPeers(ch){
  const list=ch.peers||[];
  const mine=list.find(p=>p.sameTab);if(mine)myPeer=mine.peer;
  const seen=new Set();
  for(const p of list){
    if(p.sameTab||p.kind!=='viewer')continue;
    const pr=p.presence||{};if(typeof pr.name!=='string'||!pr.name)continue;
    seen.add(p.peer);
    let e=peers.get(p.peer);
    if(!e){const g=makeAvatar(validColor(pr.color),pr.name);g.position.set(+pr.x||0,0,+pr.z||-8);
      e={kind:'peer',peer:p.peer,key:'peer:'+p.peer,g,name:'',hobby:null};g.userData={ref:e};pickables.push(g);
      e.nameTag=tag('name','',()=>g.position,2.35);peers.set(p.peer,e);e.isNew=true;}
    e.name=String(pr.name).slice(0,12);const fl=flagById(pr.cty);e.flag=fl;e.nameTag.el.textContent=(fl?fl+' ':'')+e.name+(p.isMe?' (내 다른 화면)':'');
    const W=who(fl,e.name,validColor(pr.color));if(e.isNew){e.isNew=false;feed(ic('e_hi')+' '+W+': 안녕하세요!');}
    e.hobby=HK.includes(pr.hobby)?pr.hobby:null;e.color=validColor(pr.color);e.gs=pr.gs&&Number.isFinite(+pr.gs.s)?{s:Math.max(0,Math.min(99,+pr.gs.s|0)),w:+pr.gs.w||0}:null;
    e.tx=Math.max(-38,Math.min(38,+pr.x||0));e.tz=Math.max(-38,Math.min(38,+pr.z||0));
    {const a=pr.act,sp=a&&SPOT[a.s],h=a&&HK.includes(a.h)?a.h:null;
     if(sp&&h){if(!e.act||e.act.spot!==sp||e.act.h!==h){feed(W+': '+actLine(sp,h));if(e.actTag)untag(e.actTag);e.act={spot:sp,h,t0:performance.now()};e.actTag=tag('actic',icw(h),()=>e.g.position,3.1);}}
     else if(e.act){e.act=null;if(e.actTag){untag(e.actTag);e.actTag=null;}e.g.position.y=0;resetLimbs(e.g);}}
    if(pr.say&&typeof pr.say.text==='string'&&pr.say.ts!==e.sayTs){e.sayTs=pr.say.ts;bubble(e,pr.say.text);feed(W+': '+esc(plain(pr.say.text).slice(0,90)));}
    if(pr.emo&&typeof pr.emo.k==='string'&&pr.emo.ts!==e.emoTs){e.emoTs=pr.emo.ts;showEmo(e,pr.emo.k);if(EMOS.includes(pr.emo.k))feed(W+' '+ic(pr.emo.k));}
    if(e.gs){const prev=e.gsPrev;if(prev&&e.gs.s>prev.s)feed(W+' '+ic('dice')+' <i>+'+(e.gs.s-prev.s)+'</i> ('+e.gs.s+'점)');if(e.gs.w&&!(prev&&prev.w))feed(ic('trophy')+' '+W+' 30점! 이겼어요!');e.gsPrev={s:e.gs.s,w:e.gs.w};}
    const a=pr.ask;
    if(a&&myPeer&&a.to===myPeer&&typeof a.ts==='number'&&typeof a.text==='string'&&['hobby','where','propose','meet'].includes(a.kind)){
      const k=p.peer+':'+a.ts;if(!handled.has(k)){handled.add(k);promptQ.push({from:e,a});renderPrompt();}}
    const r=pr.reply, pc=pconv[e.key];
    if(r&&myPeer&&r.to===myPeer&&pc&&pc.pending&&r.re===pc.pending.ts&&r.kind===pc.pending.kind)peerGotReply(e,r);
  }
  for(const [id,e] of peers){if(!seen.has(id)){if(e.name)feed(ic('back')+' '+who(e.flag,e.name)+': 안녕히 계세요!');scene.remove(e.g);pickables.splice(pickables.indexOf(e.g),1);untag(e.nameTag);if(e.bub)untag(e.bub);if(e.actTag)untag(e.actTag);if(e.emoT)untag(e.emoT);peers.delete(id);}}
  updPeople();if(game.on)drawPanel();
}

async function connectRoom(){
  try{
    const base=await useCap('room');if(!base)throw 0;
    $('#peopleChip').innerHTML=tx(T('waiting'));
    base.onPeers(()=>{},()=>{});
    // 한꺼번에 들어와도 흩어지도록 잠깐 기다렸다가, 자리가 남은 마을(최대 TOWN_CAP명)에 들어가요
    await new Promise(r=>setTimeout(r,1200+Math.random()*1800));

    for(const p of base.peers()){if(p.sameTab)continue;const t=+((p.presence||{}).town)||0;if(t>0)counts[t]=(counts[t]||0)+1;}
    let n=1;while((counts[n]||0)>=TOWN_CAP)n++;

// 대답하는 사람의 카드 (정답 + 헷갈리는 카드 1~2장)
function ansSet(kind,h){
  const pk=pko(h),vb=V(h,'pl');
  if(kind==='hobby')return{cards:['제','취미는',h,'+'+(bat(h)?'이에요':'예요'),'+'+(bat(h)?'예요':'이에요'),pk],ok:['제 취미는 '+cop(h),'저는 '+eul(h)+' 좋아해요','제 취미는 '+cop(h)+'.']};
  if(kind==='where')return{cards:[pk,'+에서','+에',eul(h),vb,pk==='학교'?'공원':'학교'],ok:[pk+'에서 '+eul(h)+' '+vb,pk+'에서 '+vb]};
  if(kind==='when')return{cards:['토요일','일요일','+에','+에서',eul(h),vb],ok:['토요일','일요일'].map(d=>d+'에 '+eul(h)+' '+vb)};
  if(kind==='propose')return{cards:['네,','좋아요','아니요,','미안해요'],ok:['네, 좋아요','아니요, 미안해요']};
  const ok=[];for(const d of ['토요일','일요일'])for(const t of TIMES)ok.push(d+' '+t[0]+'에 만나요');
  return{cards:['토요일','일요일'].concat(TIMES.map(t=>t[0]),['+에','+에서','만나요']),ok};
}
// 질문하는 사람의 카드
function askSet(kind,h){
  if(kind==='hobby')return{cards:['취미가','취미를','뭐예요?','어디예요?'],ok:['취미가 뭐예요?']};
  if(kind==='where')return{cards:['어디에서','어디에',eul(h),V(h,'pl')+'?'],ok:['어디에서 '+eul(h)+' '+V(h,'pl')+'?']};
  if(kind==='propose')return{cards:['같이',eul(h),V(h,'pr')+'?',V(h,'pl')+'?'],ok:['같이 '+eul(h)+' '+V(h,'pr')+'?']};

const FC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
const isC=x=>typeof x==='string'&&x.length===1&&CHO.indexOf(x)>=0, isV=x=>typeof x==='string'&&x.length===1&&JUNG.indexOf(x)>=0;

  while(i<a.length){const x=a[i];
    if(isC(x)&&isV(a[i+1])){let v=a[i+1];i+=2;if(isV(a[i])&&VC[v+a[i]]){v=VC[v+a[i]];i++;}
      let f='';if(isC(a[i])&&JONG.indexOf(a[i])>0&&!isV(a[i+1])){f=a[i];i++;if(isC(a[i])&&FC[f+a[i]]&&!isV(a[i+1])){f=FC[f+a[i]];i++;}}
      o+=String.fromCharCode(0xAC00+(CHO.indexOf(x)*21+JUNG.indexOf(v))*28+JONG.indexOf(f));continue;}
    if(isV(x)&&isV(a[i+1])&&VC[x+a[i+1]]){o+=VC[x+a[i+1]];i+=2;continue;}
    o+=x;i++;}

const HRS=['한','두','세','네','다섯','여섯','일곱','여덟','아홉','열','열한','열두'];
function timeSet(h){const o=eul(h),v=V(h,'pl'),ok=[];
  const hs=['두','세','네','다섯'];
  for(const ap of ['','오전 ','오후 '])for(let a=0;a<hs.length;a++)for(let b=a+1;b<hs.length;b++)ok.push(ap+hs[a]+' 시부터 '+hs[b]+' 시까지 '+o+' '+v);
  return{cards:['오전','오후'].concat(hs.map(x=>x+' 시'),['+부터','+까지','+에',o,v]),ok,fix:'오후 세 시부터 네 시까지 '+o+' '+v};}
function parseSpan(t){const m=norm(t).match(/(오전|오후)?(한|두|세|네|다섯|여섯|일곱|여덟|아홉|열한|열두|열)시부터(한|두|세|네|다섯|여섯|일곱|여덟|아홉|열한|열두|열)시까지/);
  if(!m)return{a:15,b:16,ap:'오후'};const pm=m[1]!=='오전';const toH=w=>{const n=HRS.indexOf(w)+1;return pm&&n<12?n+12:n;};return{a:toH(m[2]),b:toH(m[3]),ap:m[1]||''};}

function applyPose(ent,a,now,dt,isMe){
  const g=ent.g,sp=a.spot,t=(now-a.t0)/1000,u=g.userData;
  g.rotation.x=0;
  switch(sp.pose){
    case 'sit':g.position.set(sp.x,.28,sp.z);g.rotation.y=sp.face;animWalk(g,false,now);
      if(u.hands)u.hands[0].position.y=u.hands[1].position.y=.78+Math.abs(Math.sin(t*8))*.06;break;
    case 'cook':g.position.set(sp.x,0,sp.z);g.rotation.y=sp.face;if(u.hands){u.hands[1].position.y=.85+Math.sin(t*7)*.12;}
      if(isMe&&(ent._lf=(ent._lf||0)+dt)>.8){ent._lf=0;floatIcon('think',new THREE.Vector3(-12.6,1.6,27.2));}break;
    case 'sing':g.position.set(sp.x,Math.abs(Math.sin(t*5))*.12,sp.z);g.rotation.y=sp.face;if(u.hands)u.hands[0].position.y=1.05;
      if((ent._lf=(ent._lf||0)+dt)>.55){ent._lf=0;floatIcon('music',g.position.clone().add(new THREE.Vector3((Math.random()-.5)*1.2,2.2,0)));}break;
    case 'swim':{const ph=t*.55;g.position.set(sp.x+Math.sin(ph)*3,-.78+Math.sin(t*4)*.05,sp.z);g.rotation.y=Math.cos(ph)>0?Math.PI/2:-Math.PI/2;
      if(u.hands){u.hands[0].position.y=.7+Math.sin(t*6)*.35;u.hands[1].position.y=.7-Math.sin(t*6)*.35;}break;}
    case 'shoot':{g.position.set(sp.x,0,sp.z);g.rotation.y=sp.face;const q=(t%1.5)/1.5;
      if(u.hands)u.hands[0].position.y=u.hands[1].position.y=q<.15?1.2:.7;
      if(isMe&&actBall){const from=new THREE.Vector3(sp.x-.4,1.6,sp.z),to=new THREE.Vector3(-24.45,3.05,15);
        if(q<.75){const k=q/.75;actBall.position.lerpVectors(from,to,k);actBall.position.y+=Math.sin(k*Math.PI)*2.2;}else{const k=(q-.75)/.25;actBall.position.set(-24.45,3.05-k*2.8,15);}}break;}
    case 'kick':{g.position.set(sp.x-Math.max(0,Math.sin((t%1.6)/1.6*Math.PI*2))*.15,0,sp.z);g.rotation.y=sp.face;animWalk(g,(t%1.6)<.3,now);
      if(isMe&&actBall){const k=(t%1.6)/1.6;actBall.position.set(sp.x+.6+k*3.3,.28+Math.sin(k*Math.PI)*.6,sp.z+Math.sin(k*9)*.15);}break;}
    case 'jump':{g.position.set(sp.x,Math.abs(Math.sin(t*4.5))*.7,sp.z);g.rotation.y=sp.face;if(u.hands){const up=Math.abs(Math.sin(t*4.5));u.hands[0].position.y=u.hands[1].position.y=.7+up*.7;}break;}
    case 'walkloop':{const ang=t*.45,cx=-19,cz=-4;g.position.set(cx+Math.cos(ang)*3,0,cz+Math.sin(ang)*3);g.rotation.y=Math.atan2(-Math.sin(ang),Math.cos(ang));animWalk(g,true,now);break;}
    case 'climb':{const k=(t%12)/12,sx=sp.x,sz=sp.z,dx=SUMMIT.x-sx,dz=SUMMIT.z-sz,L=Math.hypot(dx,dz),go=Math.min(k*1.25,1)*(L-3.4);
      const x=sx+dx/L*go,z=sz+dz/L*go,d=Math.hypot(x-SUMMIT.x,z-SUMMIT.z);g.position.set(x,Math.max(0,12*(1-d/8))-.1,z);g.rotation.y=Math.atan2(dx,dz);animWalk(g,k<.8,now);break;}
    case 'ride':{const per=14,k=(t%per)/per,f=k<.5?k*2:2-k*2;g.position.set(9.5+f*26,.4,sp.z);g.rotation.y=k<.5?Math.PI/2:-Math.PI/2;animWalk(g,true,now);break;}
  }
}

const CTX={npc:'NPC 대화',peer_ask:'친구에게 묻기',peer_answer:'친구에게 대답',act_place:'장소 활동 ① 에서',act_time:'장소 활동 ② 부터·까지',game:'보드게임',obj:'이/그/저'};

function grammarOf(a){const e=String(a.exp||''),g=[];

  if(/(이에요|예요)$/.test(e.replace(/[.?!]/g,'')))g.push('이에요/예요');if(/까요\??$/.test(e))g.push('-ㄹ까요?');if(/좋아해요/.test(e))g.push('좋아해요');

function analyze(ev){
  const st=new Map();const S=sid=>{if(!st.has(sid))st.set(sid,{sid,name:'',cty:'',hobby:'',first:Infinity,last:0,n:0,ok:0,f:0,fok:0,places:new Set(),acts:0,mission:0,score:0,ev:[]});return st.get(sid);};
  const A=[],hob={},actH={},actSec={},place={},emo={};
  for(const e of ev){const s=S(e.sid);s.name=e.name||s.name;s.cty=e.cty||s.cty;s.first=Math.min(s.first,e.ts);s.last=Math.max(s.last,e.ts);s.ev.push(e);const d=e.d||{};
    if(e.type==='join'||e.type==='hobby'){s.hobby=d.hobby||d.h||s.hobby;}
    if(e.type==='place'){s.places.add(d.p);place[d.p]=(place[d.p]||0)+1;}
    if(e.type==='act'){s.acts++;actH[d.h]=(actH[d.h]||0)+1;}
    if(e.type==='act_end'){actSec[d.h]=(actSec[d.h]||0)+(+d.sec||0);}
    if(e.type==='emo'){emo[d.k]=(emo[d.k]||0)+1;}
    if(e.type==='mission')s.mission=Math.max(s.mission,+d.done||0);

    if(e.type==='answer'){A.push(Object.assign({sid:e.sid,cty:e.cty,name:e.name,ts:e.ts},d));s.n++;if(d.ok)s.ok++;if(d.tries===1){s.f++;if(d.ok)s.fok++;}}}
  for(const s of st.values())if(s.hobby)hob[s.hobby]=(hob[s.hobby]||0)+1;
  const by=(keyf)=>{const m={};for(const a of A){for(const k of [].concat(keyf(a))){m[k]=m[k]||{n:0,ok:0,f:0,fok:0};m[k].n++;if(a.ok)m[k].ok++;if(a.tries===1){m[k].f++;if(a.ok)m[k].fok++;}}}return m;};
  const wrong={};for(const a of A)if(!a.ok){const k=a.exp;wrong[k]=wrong[k]||{exp:k,ctx:a.ctx,n:0,said:{}};wrong[k].n++;wrong[k].said[a.said]=(wrong[k].said[a.said]||0)+1;}
  return{st,A,hob,actH,actSec,place,emo,ctx:by(a=>a.ctx==='game'&&a.qt?'게임 '+(QT[a.qt]||a.qt):(CTX[a.ctx]||a.ctx)),gram:by(grammarOf),cty:by(a=>a.cty||'xx'),wrong:Object.values(wrong).sort((x,y)=>y.n-x.n)};
}

  let h='<div class="tiles"><div class="tile2"><span>참여 학생</span><b>'+studs.length+'</b></div><div class="tile2"><span>대답한 수</span><b>'+tot+'</b></div><div class="tile2"><span>첫 시도 정답률</span><b>'+pct(fok,f.length)+'%</b></div><div class="tile2"><span>평균 참여 시간</span><b>'+mins+'분</b></div></div>';
  if(!dashEv.length){$('#dBody').innerHTML=h+'<p class="hint">아직 기록이 없어요. 학생들이 마을에 들어와 대답하면 여기에 쌓여요.</p>';return;}
  const hobRows=Object.entries(R.hob).map(([k,v])=>({l:k,v,icon:icw(k)})).sort((a,b)=>b.v-a.v);
  const actRows=Object.entries(R.actH).map(([k,v])=>({l:k,v,icon:icw(k),sec:R.actSec[k]||0})).sort((a,b)=>b.v-a.v);
  const plRows=Object.entries(R.place).map(([k,v])=>({l:(P[k]||{}).ko||k,v,icon:icw((P[k]||{}).ko)})).sort((a,b)=>b.v-a.v);
  const fmtAcc=r=>r.v+'% <small>('+r.n+')</small>';
  h+='<div class="dgrid">';
  h+='<div class="dcard"><h2>문법별 첫 시도 정답률</h2><div class="sub">낮은 것부터. 괄호는 첫 시도 대답 수</div>'+barsHtml(accRows(R.gram),100,fmtAcc)+'</div>';
  h+='<div class="dcard"><h2>활동별 첫 시도 정답률</h2><div class="sub">어디에서 대답했는지</div>'+barsHtml(accRows(R.ctx),100,fmtAcc)+'</div>';
  h+='<div class="dcard"><h2>학생들이 고른 취미</h2><div class="sub">입장할 때 고른 내 취미</div>'+barsHtml(hobRows)+'</div>';
  h+='<div class="dcard"><h2>많이 한 장소 활동</h2><div class="sub">활동 시작 횟수 · 머문 시간</div>'+barsHtml(actRows,0,r=>r.v+' <small>'+Math.round(r.sec/60)+'분</small>')+'</div>';
  h+='<div class="dcard"><h2>많이 간 장소</h2>'+barsHtml(plRows)+'</div>';
  h+='<div class="dcard"><h2>나라별 첫 시도 정답률</h2>'+barsHtml(accRows(R.cty).map(r=>{const c=COUNTRIES.find(x=>x.id===r.l);return Object.assign(r,{l:c?c.f+' '+c.ko:r.l});}),100,fmtAcc)+'</div>';
  h+='</div>';
  h+='<div class="dcard"><h2>자주 틀린 문장</h2><div class="sub">정답 문장과 학생들이 실제로 만든 문장</div><div style="overflow-x:auto"><table class="dt"><tr><th>정답 문장</th><th>어디서</th><th>틀린 수</th><th>학생이 만든 문장 (많은 순)</th></tr>'+
    R.wrong.slice(0,15).map(w=>'<tr><td>'+esc(w.exp)+'</td><td>'+esc(CTX[w.ctx]||w.ctx)+'</td><td class="n bad">'+w.n+'</td><td>'+Object.entries(w.said).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t,c])=>esc(t||'(빈칸)')+(c>1?' ×'+c:'')).join('<br>')+'</td></tr>').join('')+'</table></div>'+
    '<div class="row"><button class="btn" id="dAi" type="button"'+(sampleFn?'':' disabled')+'>AI로 오류 패턴 정리하기</button></div><div id="dAiOut"></div></div>';
  h+='<div class="dcard"><h2>학생별 기록</h2><div class="sub">줄을 누르면 그 학생의 활동 순서가 보여요</div><div style="overflow-x:auto"><table class="dt"><tr><th>학생</th><th>취미</th><th>대답</th><th>정답률</th><th>첫 시도</th><th>장소</th><th>활동</th><th>미션</th><th>게임</th><th>참여</th></tr>'+
    studs.sort((a,b)=>b.n-a.n).map(s=>{const c=COUNTRIES.find(x=>x.id===s.cty);return '<tr class="pick" data-sid="'+esc(s.sid)+'"><td>'+esc((c?c.f+' ':'')+s.name)+'</td><td>'+icw(s.hobby)+esc(s.hobby)+'</td><td class="n">'+s.n+'</td><td class="n">'+pct(s.ok,s.n)+'%</td><td class="n">'+pct(s.fok,s.f)+'%</td><td class="n">'+s.places.size+'</td><td class="n">'+s.acts+'</td><td class="n">'+s.mission+'/6</td><td class="n">'+s.score+'</td><td class="n">'+Math.round(Math.max(0,s.last-s.first)/60000)+'분</td></tr>';}).join('')+'</table></div><div id="dTl"></div></div>';
  $('#dBody').innerHTML=h;
  $('#dBody').querySelectorAll('tr.pick').forEach(tr=>tr.onclick=()=>{const s=R.st.get(tr.dataset.sid);if(!s)return;
    $('#dTl').innerHTML='<h2 style="font-size:15px;margin:10px 0 4px">'+esc(s.name)+'의 활동 순서</h2><div class="tl">'+s.ev.map(e=>'<div><time>'+tstr(e.ts)+'</time><span>'+esc(evLine(e))+'</span></div>').join('')+'</div>';});
  const ai=$('#dAi');if(ai)ai.onclick=()=>aiSummary(R);
}
async function aiSummary(R){
  const out=$('#dAiOut');if(!sampleFn){out.innerHTML='<p class="hint">AI를 쓸 수 없어요.</p>';return;}
  out.innerHTML='<p class="hint">정리하는 중이에요…</p>';
  const gram=accRows(R.gram).map(r=>r.l+': 첫 시도 '+r.v+'% ('+r.n+'회)').join('\n');
  const wr=R.wrong.slice(0,25).map(w=>'정답 "'+w.exp+'" ('+(CTX[w.ctx]||w.ctx)+', 틀림 '+w.n+'회) ← 학생 문장: '+Object.keys(w.said).slice(0,4).map(x=>'"'+x+'"').join(', ')).join('\n');
  try{
    const r=await sampleFn.json('You are helping a Korean-language teacher review a class of beginner (A1) multilingual teenagers who practiced textbook Units 2-3 (hobbies, places, 에서, time+에, -부터 -까지, -ㄹ까요?, 이에요/예요, 을/를, 이/그/저) in a game by building sentences from word cards. Here is the data.\nGrammar first-try accuracy:\n'+gram+'\nMost frequent wrong answers:\n'+wr+'\nWrite in Korean for the teacher: 3-5 concise error patterns you see (each with a short example from the data), and 2-3 concrete suggestions for the next lesson. Do not guess beyond the data. Reply with ONLY JSON: {"patterns":["..."],"next":["..."]}',{modelTier:'default',cache:false});
    out.innerHTML='<div class="aisum"><b>오류 패턴</b><ul>'+(r.patterns||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><b>다음 수업 제안</b><ul>'+(r.next||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p class="hint">AI 정리는 참고용이에요. 표의 실제 문장과 함께 확인해 주세요.</p></div>';
  }catch(e){out.innerHTML='<p class="hint">AI 정리에 실패했어요. 잠시 후 다시 눌러 주세요.</p>';}
}
async function loadDash(){
  $('#dBody').innerHTML='<p class="hint">기록을 불러오는 중이에요…</p>';
  try{
    if(DEPLOYED){
      if(!dashPass){$('#dLogin').hidden=false;$('#dBody').innerHTML='';return;}
      const r=await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/functions/v1/report',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+CFG.supabaseAnonKey,apikey:CFG.supabaseAnonKey},body:JSON.stringify({pass:dashPass})});
      if(r.status===401){dashPass='';$('#dLogin').hidden=false;$('#dLoginMsg').textContent='비밀번호가 맞지 않아요.';$('#dBody').innerHTML='';return;}
      if(r.status===429){dashPass='';$('#dLogin').hidden=false;$('#dLoginMsg').textContent='여러 번 틀렸어요. 1분 뒤에 다시 해 주세요.';$('#dBody').innerHTML='';return;}
      if(!r.ok)throw 0;const j=await r.json();$('#dLogin').hidden=true;
      dashEv=(j.events||[]).map(e=>({ts:Date.parse(e.ts),sid:e.sid,name:e.name,cty:e.cty,town:e.town,type:e.type,d:e.data||{}}));
    }else{
      const d=await logDb();if(!d)throw 0;const snap=await d.collection('events').orderBy('at','asc').limit(1000).get();
      dashEv=[];for(const doc of snap.docs){const v=doc.data()||{};if(Array.isArray(v.b))for(const e of v.b)if(e&&typeof e.type==='string')dashEv.push(e);}
    }
    dashEv.sort((a,b)=>a.ts-b.ts);renderDash();
  }catch(e){$('#dBody').innerHTML='<p class="hint">기록을 불러오지 못했어요. 새로 불러오기를 눌러 주세요.</p>';}
}
function openDash(){$('#dash').hidden=false;loadDash();}
$('#dashBtn').onclick=openDash;$('#dClose').onclick=()=>{$('#dash').hidden=true;};$('#dRefresh').onclick=loadDash;
$('#dLogin').onsubmit=ev=>{ev.preventDefault();dashPass=$('#dPass').value;$('#dLoginMsg').textContent='';loadDash();};
$('#dCsv').onclick=async()=>{
  const cols=['time','sid','name','country','town','type','ctx','question','expected','said','ok','tries','mode','ai','ms','hobby','place','detail'];
  const q=v=>{const t=String(v==null?'':v);return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
  const lines=[cols.join(',')].concat(dashEv.map(e=>{const d=e.d||{};return [new Date(e.ts).toISOString(),e.sid,e.name,e.cty,e.town,e.type,d.ctx||'',d.q||'',d.exp||'',d.said||'',d.ok===undefined?'':(d.ok?1:0),d.tries||'',d.mode||'',d.ai?1:'',d.ms||'',d.h||d.hobby||'',d.p||d.place||d.spot||'',e.type==='answer'?'':evLine(e)].map(q).join(',');}));
  const data='﻿'+lines.join('\n'),fn='hobby-town-log-'+new Date().toISOString().slice(0,10)+'.csv';
  if(!DEPLOYED){try{const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:fn,data});return;}}catch(e){return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();
};
// 주소 끝에 #teacher 또는 ?teacher 를 붙이면 분석 화면이 열려요 (이미 열린 페이지에서 주소만 바꿔도 열려요)
const isTeacher=()=>location.hash==='#teacher'||/[?&]teacher\b/.test(location.search);
if(DEPLOYED&&isTeacher()){openDash();}
window.addEventListener('hashchange',()=>{if(DEPLOYED&&isTeacher()&&$('#dash').hidden)openDash();});

/* ---------- intro ---------- */
const sw=$('#swatches');
function drawSw(){sw.innerHTML=COLORS.map(c=>'<button class="sw" type="button" style="background:'+c+'" data-c="'+c+'" aria-label="'+c+'" aria-pressed="'+(c===me.color)+'"></button>').join('');}
sw.onclick=e=>{const b=e.target.closest('[data-c]');if(b){me.color=b.dataset.c;drawSw();}};drawSw();
function drawHobby(){const pl=pko(me.hobby);$('#hName').innerHTML=icw(me.hobby)+esc(me.hobby);$('#hEn').innerHTML=icw(pl)+' '+esc(pl)+'에서 '+esc(act(me.hobby));}
function drawHGrid(){$('#hgrid').innerHTML=HK.map(h=>'<button class="hb" type="button" data-h="'+h+'" aria-pressed="'+(h===me.hobby)+'">'+icw(h)+esc(h)+'</button>').join('');}
drawHobby();drawHGrid();
$('#hgrid').onclick=ev=>{const b=ev.target.closest('[data-h]');if(!b)return;me.hobby=b.dataset.h;if(me.name)logEv('hobby',{h:me.hobby});drawHobby();drawHGrid();speak(me.hobby);};
$('#countries').innerHTML=COUNTRIES.map(c=>'<button class="cty" type="button" data-cty="'+c.id+'" aria-pressed="'+(c.id===me.country)+'"><span class="f">'+c.f+'</span><b>'+esc(c.n)+'</b><small>'+esc(c.ko)+'</small></button>').join('');
function showStep2(){const c=ctyOf();$('#step1').hidden=true;$('#step2').hidden=false;$('#ctyTitle').textContent=c.f+' '+c.ko;
  applyI18n();$('#nick').placeholder=T('namePh');$('#soundMsg').textContent='';}
$('#countries').onclick=ev=>{const b=ev.target.closest('[data-cty]');if(!b)return;me.country=b.dataset.cty;me.lang=ctyOf().l;save();showStep2();};
$('#back').onclick=()=>{$('#step2').hidden=true;$('#step1').hidden=false;};
$('#soundBtn').onclick=()=>{speak('안녕하세요');pickVoice();
  let has=true;try{const vs=speechSynthesis.getVoices();has=!('speechSynthesis' in window)?false:(vs.length===0||!!koVoice);}catch(e){has=false;}
  $('#soundMsg').innerHTML=has?tx(T('soundOk')):tx(T('soundNo'));};
$('#nick').value=me.name;
/* 이름 칸: 화면 속 한글 키보드가 기본. 지구 버튼을 누르면 휴대폰 키보드(내 나라 글자·영어)로 바꿔요 */
const nk={on:true,base:me.name||'',jamo:[],shift:false};
function nkText(){return (nk.base+compose(nk.jamo)).slice(0,12);}
function drawNameKb(){
  const el=$('#nameKb');const btn=$('#nameKbBtn');const inp=$('#nick');
  btn.setAttribute('aria-pressed',String(nk.on));btn.innerHTML=nk.on?ic('globe')+' ABC':ic('pencil')+' 한글';
  inp.readOnly=nk.on;inp.inputMode=nk.on?'none':'text';
  if(!nk.on){el.hidden=true;return;}
  el.hidden=false;
  el.innerHTML=KB.map(row=>'<div>'+row.map(k=>{const v=nk.shift&&SHIFT[k]?SHIFT[k]:k;
      if(k==='⇧')return '<button type="button" class="w2" data-nk="shift" aria-pressed="'+nk.shift+'" aria-label="Shift">⇧</button>';
      if(k==='⌫')return '<button type="button" class="w2" data-nk="bk" aria-label="지워요">⌫</button>';
      return '<button type="button" data-nk="k:'+v+'">'+v+'</button>';}).join('')+'</div>').join('')+
    '<div><button type="button" class="w5" data-nk="k: " aria-label="띄어쓰기">␣</button></div>';
}
$('#nameKb').addEventListener('click',ev=>{const b=ev.target.closest('[data-nk]');if(!b)return;const k=b.dataset.nk;
  if(k==='shift'){nk.shift=!nk.shift;}
  else if(k==='bk'){if(nk.jamo.length)nk.jamo.pop();else nk.base=nk.base.slice(0,-1);}
  else if(k.startsWith('k:')&&nkText().length<12){const c=k.slice(2);if(c===' '){nk.base=nkText()+' ';nk.jamo=[];}else nk.jamo.push(c);nk.shift=false;}
  $('#nick').value=nkText();drawNameKb();});
$('#nameKbBtn').onclick=()=>{if(nk.on){nk.base=nkText();nk.jamo=[];nk.on=false;drawNameKb();$('#nick').focus();}
  else{nk.base=$('#nick').value.slice(0,12);nk.jamo=[];nk.on=true;$('#nick').blur();drawNameKb();}};
$('#nick').addEventListener('input',()=>{if(!nk.on){nk.base=$('#nick').value;}});
drawNameKb();
if(me.country)showStep2();else applyI18n();
$('#start').onclick=()=>{
  const n=$('#nick').value.trim().slice(0,12);if(!n){$('#nick').classList.add('need');setTimeout(()=>$('#nick').classList.remove('need'),900);if(!nk.on)$('#nick').focus();return;}
  me.name=n;save();logEv('join',{hobby:me.hobby,color:me.color,lang:(navigator.language||'').slice(0,10)});
  player.g=makeAvatar(me.color,me.name);player.g.position.set(0,0,-8);
  tag('name me',esc(ctyOf().f+' '+me.name),()=>player.g.position,2.35);
  $('#intro').hidden=true;$('#emoBar').hidden=false;$('#gameBtn').hidden=false;speak('안녕하세요');applyI18n();updateMissions();updPeople();
  connectRoom().then(()=>{pub({name:me.name,color:me.color,hobby:me.hobby,cty:me.country,x:0,z:-8});pubGame();});
  toastMsg(tx(T('startToast')),'');$('#feed').hidden=false;feed(ic('e_hi')+' '+meWho()+': 안녕하세요!');
};
})();
